# Docker Compose — v3 Full Stack (all 20+ services + middleware)
version: "3.9"

services:
  # ─── Middleware ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insureportal
      POSTGRES_USER: insureportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insureportal}
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureportal"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: ["kafka_data:/bitnami/kafka"]

  temporal:
    image: temporalio/auto-setup:latest
    ports: ["7233:7233"]
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: insureportal
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-insureportal}
      POSTGRES_SEEDS: postgres
    depends_on: [postgres]

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
    ports: ["9200:9200"]
    volumes: ["os_data:/usr/share/opensearch/data"]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
    ports: ["8080:8080"]

  apisix:
    image: apache/apisix:3.8.0-debian
    ports: ["9080:9080", "9443:9443"]
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml

  # ─── Go Services ───────────────────────────────────────────────────
  ai-advisor:
    build: ../../services/python/ai-advisor
    ports: ["8110:8110"]
    environment:
      PORT: "8110"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092

  fraud-network-graph:
    build: ../../services/python/fraud-network-graph
    ports: ["8111:8111"]
    environment:
      PORT: "8111"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092

  micro-moment-insurance:
    build: ../../services/go/micro-moment-insurance
    ports: ["8112:8112"]
    environment:
      PORT: "8112"
      DATABASE_URL: postgres://insureportal:insureportal@postgres:5432/insureportal
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092

  did-identity:
    build: ../../services/rust/did-identity
    ports: ["8113:8113"]
    environment:
      PORT: "8113"
      REDIS_URL: redis://redis:6379

  health-wearables:
    build: ../../services/python/health-wearables
    ports: ["8114:8114"]
    environment:
      PORT: "8114"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092

  smart-contract-settlement:
    build: ../../services/go/smart-contract-settlement
    ports: ["8115:8115"]
    environment:
      PORT: "8115"
      KAFKA_BROKERS: kafka:9092

  agent-superapp-bff:
    build: ../../services/go/agent-superapp-bff
    ports: ["8116:8116"]
    environment:
      PORT: "8116"
      DATABASE_URL: postgres://insureportal:insureportal@postgres:5432/insureportal
      REDIS_URL: redis://redis:6379

  multi-country:
    build: ../../services/go/multi-country
    ports: ["8117:8117"]
    environment:
      PORT: "8117"

  data-mesh-router:
    build: ../../services/go/data-mesh-router
    ports: ["8118:8118"]
    environment:
      PORT: "8118"
      OPENSEARCH_URL: http://opensearch:9200

  digital-twin:
    build: ../../services/python/digital-twin
    ports: ["8119:8119"]
    environment:
      PORT: "8119"
      REDIS_URL: redis://redis:6379

  nhia-integration:
    build: ../../services/go/nhia-integration
    ports: ["8120:8120"]
    environment:
      PORT: "8120"
      KAFKA_BROKERS: kafka:9092

  compliance-calendar:
    build: ../../services/go/compliance-calendar
    ports: ["8121:8121"]
    environment:
      PORT: "8121"
      TEMPORAL_ADDRESS: temporal:7233

  policy-summarizer:
    build: ../../services/python/policy-summarizer
    ports: ["8122:8122"]
    environment:
      PORT: "8122"
      REDIS_URL: redis://redis:6379

  smart-contract-oracle:
    build: ../../services/rust/smart-contract-oracle
    ports: ["8123:8123"]
    environment:
      PORT: "8123"
      REDIS_URL: redis://redis:6379

  whatsapp-claims-bot:
    build: ../../services/typescript/whatsapp-claims-bot
    ports: ["8124:8124"]
    environment:
      PORT: "8124"
      REDIS_URL: redis://redis:6379

  graphql-federation:
    build: ../../services/go/graphql-federation
    ports: ["8125:8125"]
    environment:
      PORT: "8125"
      REDIS_URL: redis://redis:6379

  carbon-credit-insurance:
    build: ../../services/go/carbon-credit-insurance
    ports: ["8126:8126"]
    environment:
      PORT: "8126"
      KAFKA_BROKERS: kafka:9092

volumes:
  pg_data:
  kafka_data:
  os_data:
