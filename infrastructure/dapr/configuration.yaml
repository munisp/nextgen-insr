apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: insureportal-config
  namespace: insureportal
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "otel-collector:4317"
      isSecure: false
      protocol: grpc
  metric:
    enabled: true
    rules:
      - name: insureportal_*
        labels:
          - name: service
          - name: method
          - name: status
  logging:
    apiLogging:
      enabled: true
      obfuscateURLs: false
  middleware:
    http:
      - name: ratelimit
        type: middleware.http.ratelimit
        version: v1
      - name: oauth2
        type: middleware.http.oauth2
        version: v1
  accessControl:
    defaultAction: deny
    trustDomain: "insureportal"
    policies:
      - appId: "fraud-detection"
        defaultAction: allow
        trustDomain: "insureportal"
        namespace: "insureportal"
      - appId: "api-gateway"
        defaultAction: allow
        trustDomain: "insureportal"
        namespace: "insureportal"
