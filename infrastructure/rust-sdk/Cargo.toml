[package]
name = "ngapp-infra-sdk"
version = "1.0.0"
edition = "2021"
description = "NGApp Infrastructure SDK — unified async clients for all 12 platform components"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1", features = ["v4"] }
