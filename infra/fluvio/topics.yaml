# ── Fluvio Topic Configuration for InsurePortal ──────────────────────────
# Real-time streaming topics for all business events

topics:

  - name: policy-events
    partitions: 6
    replicas: 3
    retention:
      time: 168h  # 7 days
      size: 10Gi
    compression: lz4
    events:
      - policy_created
      - policy_updated
      - policy_cancelled
      - policy_renewed
      - policy_lapsed

  - name: claims-events
    partitions: 6
    replicas: 3
    retention:
      time: 168h  # 7 days
      size: 10Gi
    compression: lz4
    events:
      - claim_submitted
      - claim_adjudicated
      - claim_approved
      - claim_rejected
      - claim_paid

  - name: premium-events
    partitions: 6
    replicas: 3
