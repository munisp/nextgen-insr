apiVersion: 1
providers:
  - name: "InsurePortal Dashboards"
    orgId: 1
    folder: "InsurePortal"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
