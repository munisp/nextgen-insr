apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insureportal-caddy.fullname" . }}-caddyfile
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insureportal-caddy.labels" . | nindent 4 }}
data:
  Caddyfile: |
    # Caddyfile is mounted from the ConfigMap.
    # The actual Caddyfile content is managed in infra/caddy/Caddyfile
    # and injected here during Helm chart rendering.
    # In production, use: helm upgrade --set-file caddyfile=infra/caddy/Caddyfile
    import /etc/caddy/config/*.Caddyfile
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insureportal-caddy.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insureportal-caddy.labels" . | nindent 4 }}
data:
  # Security configuration for caddy-security (Keycloak OIDC)
  # Actual values injected from secrets at runtime
  security-config.json: |
    {
      "security": {
        "authentication": {
          "portals": [
            {
              "name": "insureportal-auth-portal",
              "backends": [
                {
                  "name": "keycloak-backend",
                  "method": "oauth2",
                  "realm": "insureportal",
                  "provider": "generic"
                }
              ]
            }
          ]
        }
      }
    }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "insureportal-caddy.fullname" . }}-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insureportal-caddy.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "insureportal-caddy.selectorLabels" . | nindent 6 }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "insureportal-caddy.fullname" . }}-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insureportal-caddy.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "insureportal-caddy.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
