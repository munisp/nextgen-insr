apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insureportal-caddy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insureportal-caddy.labels" . | nindent 4 }}
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "insureportal-caddy.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "insureportal-caddy.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/caddyfile: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "2019"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: caddy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: https-quic
              containerPort: 443
              protocol: UDP
            - name: admin
              containerPort: 2019
              protocol: TCP
          env:
            - name: INSUREPORTAL_DOMAIN
              value: {{ .Values.domain.primary | quote }}
            - name: CADDY_ACME_EMAIL
              value: {{ .Values.domain.acmeEmail | quote }}
            - name: APISIX_UPSTREAM
              value: {{ .Values.upstreams.apisix | quote }}
            - name: KEYCLOAK_UPSTREAM
              value: {{ .Values.upstreams.keycloak | quote }}
            - name: KEYCLOAK_FORWARD_AUTH_URL
              value: "http://{{ .Values.upstreams.keycloakAuthProxy }}"
            - name: GRAFANA_UPSTREAM
              value: {{ .Values.upstreams.grafana | quote }}
            - name: JAEGER_UPSTREAM
              value: {{ .Values.upstreams.jaeger | quote }}
            - name: ANALYTICS_UPSTREAM
              value: {{ .Values.upstreams.analytics | quote }}
            - name: USSD_GATEWAY_UPSTREAM
              value: {{ .Values.upstreams.ussdGateway | quote }}
            - name: OPENAPPSEC_AGENT_URL
              value: "http://{{ .Values.upstreams.openappsecAgent }}"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.keycloakClientSecret.secretName }}
                  key: {{ .Values.secrets.keycloakClientSecret.key }}
            - name: CADDY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.jwtSecret.secretName }}
                  key: {{ .Values.secrets.jwtSecret.key }}
            - name: OPENAPPSEC_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.openappsecToken.secretName }}
                  key: {{ .Values.secrets.openappsecToken.key }}
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-config
              mountPath: /etc/caddy/config
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-logs
              mountPath: /var/log/caddy
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        - name: caddyfile
          configMap:
            name: {{ include "insureportal-caddy.fullname" . }}-caddyfile
        - name: caddy-config
          configMap:
            name: {{ include "insureportal-caddy.fullname" . }}-config
        - name: caddy-data
          persistentVolumeClaim:
            claimName: {{ include "insureportal-caddy.fullname" . }}-data
        - name: caddy-logs
          persistentVolumeClaim:
            claimName: {{ include "insureportal-caddy.fullname" . }}-logs
