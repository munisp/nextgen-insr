apiVersion: v1
kind: Service
metadata:
  name: {{ include "insureportal-caddy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insureportal-caddy.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
    - port: 443
      targetPort: https-quic
      protocol: UDP
      name: https-quic
  selector:
    {{- include "insureportal-caddy.selectorLabels" . | nindent 4 }}
---
# Internal admin service (ClusterIP only - never exposed externally)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insureportal-caddy.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "insureportal-caddy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 2019
      targetPort: admin
      protocol: TCP
      name: admin
  selector:
    {{- include "insureportal-caddy.selectorLabels" . | nindent 4 }}
