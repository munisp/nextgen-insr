# ─── NGApp Platform Redis Configuration (Staging) ─────────────────────────
# Optimized for staging environment with moderate data volumes

# Memory
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence: AOF for durability
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as backup
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes

# Security
protected-mode yes
# Password set via --requirepass in docker-compose

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511
hz 10
dynamic-hz yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Keyspace notifications (for expiry events used by distributed locks)
notify-keyspace-events "Ex"

# Logging
loglevel notice
logfile ""

# Databases
databases 16
