  - id: insurance-broker-trpc
    uri: /api/trpc/broker.*
    upstream_id: insurance-portal
    plugins:
      limit-req:
        rate: 60
        burst: 20
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}

  # ── Python Analytics Service ──────────────────────────────────────────────
  - id: python-analytics-actuarial
    uri: /analytics/actuarial/*
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 10
        burst: 3
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        regex_uri: ["/analytics/actuarial/(.*)", "/actuarial/$1"]
