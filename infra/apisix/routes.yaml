      limit-req:
        rate: 10
        burst: 3
        key: remote_addr
        rejected_code: 429
      prometheus: {}

  # ── OpenAppSec WAF health + management ───────────────────────────────────
  - id: openappsec-health
    uri: /waf/health
    upstream_id: openappsec-agent
    plugins:
      limit-req:
        rate: 5
        burst: 2
        key: remote_addr
        rejected_code: 429
      prometheus: {}


upstreams:
  - id: insurance-portal
    nodes:
      app:3000: 1
    type: roundrobin
    scheme: http
    healthcheck:
      active:
        http_path: /health
        interval: 10
        timeout: 5
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_statuses: [500, 503]
          http_failures: 3

  - id: ota-service
    nodes:
      ota-service:8081: 1
    type: roundrobin
    scheme: http

  - id: fido2-service
    nodes:
      fido2-service:8083: 1
    type: roundrobin
    scheme: http

  - id: i18n-currency
    nodes:
      i18n-currency:8084: 1
    type: roundrobin
    scheme: http

  - id: fraud-engine
    nodes:
      fraud-engine:8085: 1
    type: roundrobin
    scheme: http

  - id: credit-scoring
    nodes:
      credit-scoring:8082: 1
    type: roundrobin
    scheme: http

  - id: workflow-orchestrator
    nodes:
      workflow-orchestrator:8088: 1
    type: roundrobin
    scheme: http

  - id: analytics-service
    nodes:
      analytics-service:8090: 1
    type: roundrobin
    scheme: http
    healthcheck:
      active:
        http_path: /health
        interval: 30
        timeout: 10
        healthy:
          http_statuses: [200]
          successes: 2
        unhealthy:
          http_failures: 3

  - id: settlement-service
    nodes:
      settlement-service:8091: 1
    type: roundrobin
    scheme: http

  - id: kyc-service
    nodes:
      kyc-service:8092: 1
    type: roundrobin
    scheme: http

  - id: notification-service
    nodes:
      notification-service:8093: 1
    type: roundrobin
    scheme: http

  - id: resilience-agent
    nodes:
      resilience-agent:8094: 1
    type: roundrobin
    scheme: http

  - id: sim-orchestrator
    nodes:
      sim-orchestrator:8095: 1
    type: roundrobin
    scheme: http

  - id: mdm-service
    nodes:
      mdm-service:8096: 1
    type: roundrobin
    scheme: http

consumers: []
services: []
ssls: []

global_rules:
  - id: global-security-headers
    plugins:
      response-rewrite:
        headers:
          set:
            X-Content-Type-Options: "nosniff"
            X-Frame-Options: "DENY"
            X-XSS-Protection: "1; mode=block"
            Referrer-Policy: "strict-origin-when-cross-origin"
            X-Powered-By: "InsurePortal"

plugin_configs:
  - id: cors-config
    plugins:
      cors:
        allow_origins: "https://insureportal.io,https://app.insureportal.io,https://admin.insureportal.io,https://merchant.insureportal.io"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
        allow_headers: "Content-Type,Authorization,X-Request-ID,X-Device-ID,X-Agent-ID"
        expose_headers: "X-Request-ID,X-RateLimit-Limit,X-RateLimit-Remaining"
        max_age: 3600
        allow_credential: true

  # ── MDM Compliance Engine ──────────────────────────────────────────────────
  - id: mdm-compliance-engine
    uri: /api/mdm/compliance/*
    upstream_id: mdm-compliance-engine
    plugins:
      limit-req:
        rate: 60
        burst: 20
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}
      response-rewrite:
        headers:
          X-Service: mdm-compliance-engine

  # ── MDM Geofence Service ───────────────────────────────────────────────────
  - id: mdm-geofence-service
    uri: /api/mdm/geofence/*
    upstream_id: mdm-geofence-service
    plugins:
      limit-req:
        rate: 120
        burst: 40
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}

  # ── CBN Reporting Engine ───────────────────────────────────────────────────
  - id: cbn-reporting-engine
    uri: /api/cbn/*
    upstream_id: cbn-reporting-engine
    plugins:
      limit-req:
        rate: 10
        burst: 5
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}

  # ── TigerBeetle Sidecar ────────────────────────────────────────────────────
  - id: tigerbeetle-sidecar
    uri: /api/ledger/*
    upstream_id: tigerbeetle-sidecar
    plugins:
      limit-req:
        rate: 200
        burst: 50
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}

  # ── Fluvio Streaming ───────────────────────────────────────────────────────
  - id: fluvio-api
    uri: /api/stream/*
    upstream_id: fluvio
    plugins:
      limit-req:
        rate: 500
        burst: 100
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}

  # ── Dapr Sidecar ──────────────────────────────────────────────────────────
  - id: dapr-sidecar
    uri: /api/dapr/*
    upstream_id: dapr-sidecar
    plugins:
      limit-req:
        rate: 100
        burst: 30
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}

  # ── DLQ Admin ─────────────────────────────────────────────────────────────
  - id: dlq-admin
    uri: /api/dlq/*
    upstream_id: insurance-portal
    plugins:
      limit-req:
        rate: 20
        burst: 5
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      prometheus: {}

upstreams:
  - id: mdm-compliance-engine
    nodes:
      "mdm-compliance-engine:8091": 1
    type: roundrobin
    scheme: http
    pass_host: pass
    checks:
      active:
        http_path: /health
        interval: 10
