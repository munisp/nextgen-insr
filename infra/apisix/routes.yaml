  - id: lakehouse-catalog
    uri: /analytics/lakehouse/catalog
    methods: [GET]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 20
        burst: 5
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        uri: /lakehouse/catalog
      prometheus: {}

  - id: lakehouse-dapr-subscribe
    uri: /dapr/subscribe
    methods: [GET]
    upstream_id: python-analytics
    plugins:
      proxy-rewrite:
        uri: /lakehouse/dapr/subscribe
      prometheus: {}

  - id: lakehouse-dapr-event
    uri: /lakehouse/dapr/event
    methods: [POST]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 1000
        burst: 200
        key: remote_addr
        rejected_code: 429
      proxy-rewrite:
        uri: /lakehouse/dapr/event
      prometheus: {}

  # ── Go Infra Service (TigerBeetle + Fluvio bridge) ────────────────────────
  - id: go-infra-tigerbeetle
    uri: /infra/tb/*
    upstream_id: go-infra
    plugins:
      limit-req:
        rate: 100
        burst: 30
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        regex_uri: ["/infra/tb/(.*)", "/tb/$1"]
      prometheus: {}

  - id: go-infra-fluvio
    uri: /infra/fluvio/*
    upstream_id: go-infra
    plugins:
      limit-req:
        rate: 200
        burst: 50
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        regex_uri: ["/infra/fluvio/(.*)", "/fluvio/$1"]
      prometheus: {}

  - id: go-infra-temporal
    uri: /infra/temporal/*
    upstream_id: go-infra
    plugins:
      limit-req:
        rate: 30
        burst: 10
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        regex_uri: ["/infra/temporal/(.*)", "/temporal/$1"]
      prometheus: {}

  # ── Rust Middleware (audit + rate-limit + WAF bridge) ─────────────────────
  - id: rust-middleware-audit
    uri: /middleware/audit/*
    upstream_id: rust-middleware
    plugins:
      limit-req:
        rate: 50
        burst: 15
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        regex_uri: ["/middleware/audit/(.*)", "/audit/$1"]
      prometheus: {}

  - id: rust-middleware-metrics
    uri: /middleware/metrics
    upstream_id: rust-middleware
