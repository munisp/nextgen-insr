      prometheus: {}

  - id: lakehouse-sync-fluvio
    uri: /analytics/lakehouse/sync/fluvio
    methods: [POST]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 10
        burst: 3
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        uri: /lakehouse/sync/fluvio
      prometheus: {}

  - id: lakehouse-sync-tigerbeetle
    uri: /analytics/lakehouse/sync/tigerbeetle
    methods: [POST]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 5
        burst: 2
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        uri: /lakehouse/sync/tigerbeetle
      prometheus: {}

  - id: lakehouse-sync-temporal
    uri: /analytics/lakehouse/sync/temporal
    methods: [POST]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 5
        burst: 2
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        uri: /lakehouse/sync/temporal
      prometheus: {}

  - id: lakehouse-sync-redis
    uri: /analytics/lakehouse/sync/redis
    methods: [POST]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 10
        burst: 3
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        uri: /lakehouse/sync/redis
      prometheus: {}

  - id: lakehouse-sync-dapr
    uri: /analytics/lakehouse/sync/dapr
    methods: [POST]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 5
        burst: 2
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        uri: /lakehouse/sync/dapr
      prometheus: {}

  - id: lakehouse-sync-keycloak
    uri: /analytics/lakehouse/sync/keycloak
    methods: [POST]
    upstream_id: python-analytics
    plugins:
      limit-req:
        rate: 5
        burst: 2
        key: remote_addr
        rejected_code: 429
      jwt-auth: {}
      proxy-rewrite:
        uri: /lakehouse/sync/keycloak
      prometheus: {}

  - id: lakehouse-sync-openappsec
    uri: /analytics/lakehouse/sync/openappsec
    methods: [POST]
    upstream_id: python-analytics
    plugins:
