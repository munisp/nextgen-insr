openapi: '3.0.3'
info:
  title: Reconciliation Engine
  description: Reconciliation Engine — automated transaction matching and discrepancy resolution Business Rules: - Matching strategies: exact, fuzzy (±₦10 tolerance), date-range (±1 day)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: reconciliation-engine
                  database:
                    type: string
                    example: 'true'
  /:
    get:
      summary: List batches
      responses:
        '200':
          description: Successful list batches
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /run:
    post:
      summary: Run reconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful run reconciliation
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /summary:
    get:
      summary: Get summary
      responses:
        '200':
          description: Successful get summary
        '400':
          description: Bad request
        '500':
          description: Internal server error
