openapi: '3.0.3'
info:
  title: Pan African Ekyc
  description: Pan-African eKYC — cross-border identity verification across African markets Supported: Nigeria (BVN/NIN), Ghana (Ghana Card), Kenya (IPRS), South Africa (RSA ID) Business Rules:
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: pan-african-ekyc
                  database:
                    type: string
                    example: 'true'
  /api/v1/verify:
    post:
      summary: Verify identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful verify identity
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/countries:
    get:
      summary: Supported countries
      responses:
        '200':
          description: Successful supported countries
        '400':
          description: Bad request
        '500':
          description: Internal server error
