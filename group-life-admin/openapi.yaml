openapi: '3.0.3'
info:
  title: Group Life Admin
  description: GroupLifeService handles group life insurance administration GroupScheme represents a group life insurance scheme
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: group-life-admin
                  database:
                    type: string
                    example: 'true'
  /api/group-life/premium:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/group-life/renewal-quote:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
