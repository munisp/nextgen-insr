openapi: '3.0.3'
info:
  title: Takaful Module
  description: Takaful Module — Shariah-compliant insurance operations Business Rules: - Tabarru (donation) pool model — participants contribute to shared pool
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: takaful-module
                  database:
                    type: string
                    example: 'true'
  /api/v1/products:
    get:
      summary: Takaful products
      responses:
        '200':
          description: Successful takaful products
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/pool/status:
    get:
      summary: Pool status
      responses:
        '200':
          description: Successful pool status
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/contribution:
    post:
      summary: Make contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful make contribution
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/surplus:
    get:
      summary: Surplus distribution
      responses:
        '200':
          description: Successful surplus distribution
        '400':
          description: Bad request
        '500':
          description: Internal server error
