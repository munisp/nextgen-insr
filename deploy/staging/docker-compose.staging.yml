version: "3.9"

# NGApp Staging Environment
# All microservices, middleware, and supporting infrastructure
# Usage: docker compose -f deploy/staging/docker-compose.staging.yml up -d

services:
  # ╔══════════════════════════════════════════════════════════════╗
  # ║                    CORE DATABASE & STORAGE                   ║
  # ╚══════════════════════════════════════════════════════════════╝

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ngapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging_password}
      POSTGRES_DB: ngapp_staging
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ngapp-net

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-staging_redis_pass} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ngapp-net

  # ╔══════════════════════════════════════════════════════════════╗
  # ║                   MESSAGE BROKERS & QUEUES                   ║
  # ╚══════════════════════════════════════════════════════════════╝

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: staging-cluster-001
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ngapp-net

  # Zookeeper dependency for Kafka (legacy mode) or use KRaft
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeperdata:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | telnet localhost 2181 | grep imok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ngapp-net

  # ╔══════════════════════════════════════════════════════════════╗
  # ║                   WORKFLOW & AUTHENTICATION                  ║
  # ╚══════════════════════════════════════════════════════════════╝

  temporal:
    image: temporalio/auto-setup:1.23
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: ngapp
      POSTGRES_PWD: ${DB_PASSWORD:-staging_password}
      POSTGRES_SEEDS: postgres
      TEMPORAL_MAX_QPS: "1000"
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal --address localhost:7233 cluster health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ngapp-net

  temporal-ui:
    image: temporalio/ui:2.19.1
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=*
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - ngapp-net

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/ngapp_staging
      KC_DB_USERNAME: ngapp
      KC_DB_PASSWORD: ${DB_PASSWORD:-staging_password}
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ngapp-net

  # ╔══════════════════════════════════════════════════════════════╗
  # ║                 SEARCH & ANALYTICS ENGINE                    ║
  # ╚══════════════════════════════════════════════════════════════╝

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=opensearch-staging
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ngapp-net

  permify:
    image: permify/permify:latest
    command: serve --port 3476 --postgres-url "postgresql://ngapp:${DB_PASSWORD:-staging_password}@postgres:5432/ngapp_staging?sslmode=disable"
    ports:
      - "3476:3476"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3476/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ngapp-net

  # ╔══════════════════════════════════════════════════════════════╗
  # ║                    PAYMENT & LEDGER                          ║
  # ╚══════════════════════════════════════════════════════════════╝

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    command: ["./tigerbeetle", "start", "--addresses=0.0.0.0:3000", "--data-dir=/data"]
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetledata:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ngapp-net

  # ╔══════════════════════════════════════════════════════════════╗
  # ║                  API GATEWAY (APISIX)                        ║
  # ╚══════════════════════════════════════════════════════════════╝

  apisix:
    image: apache/apisix:3.8.0
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9180:9180"
    environment:
      APISIX_DEPLOY_TYPE: docker
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ngapp-net

  # ╔══════════════════════════════════════════════════════════════╗
  # ║                   MOJALOOP DFS                               ║
  # ╚══════════════════════════════════════════════════════════════╝

  mojaloop-migrate:
    image: mojaloop/project-sandbox:latest
    command: ["npm", "run", "migrate"]
    environment:
      - NODE_ENV=staging
    depends_on:
      - postgres
    networks:
      - ngapp-net

