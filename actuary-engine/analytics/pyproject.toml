[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actuary-analytics"
version = "0.1.0"
description = "Offline actuarial analytics: reserving (chainladder), life (lifelines), freq-sev GLMs (statsmodels), capital adapter, model registry, assumption sets, batch jobs, analytic aggregate-loss distributions (aggregate), standalone Tweedie tools (tweedie), model-validation charts."
requires-python = ">=3.11"
dependencies = [
    "chainladder>=0.10.1,<0.11",
    "lifelines>=0.30.3,<0.31",
    "statsmodels>=0.15,<0.16",
    "scikit-learn>=1.5,<1.8",
    "pandas>=2.2,<2.4",
    "numpy>=1.26,<2.4",
    "fastapi>=0.111,<0.117",
    "pydantic>=2.7,<3",
    "psycopg2-binary>=2.9,<3",
    "minio>=7.2,<8",
    "httpx>=0.27,<0.29",
    "uvicorn>=0.30,<0.36",
    "aggregate>=2.1,<2.2",
    "tweedie>=0.0.9,<0.1",
    "matplotlib>=3.10,<3.12",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "testcontainers>=4,<5"]

[tool.setuptools.packages.find]
include = ["actuary_analytics*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
