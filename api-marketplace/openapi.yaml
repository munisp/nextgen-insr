openapi: '3.0.3'
info:
  title: Api Marketplace
  description: API Marketplace — developer portal for open insurance APIs Business Rules: - API tiers: Free (100 req/day), Standard (10K req/day), Enterprise (unlimited)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: api-marketplace
                  database:
                    type: string
                    example: 'true'
  /api/v1/catalog:
    get:
      summary: Api catalog
      responses:
        '200':
          description: Successful api catalog
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/subscribe:
    post:
      summary: Subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful subscribe
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/usage/{apiKey}:
    get:
      summary: Get usage
      parameters:
        - name: apiKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful get usage
        '400':
          description: Bad request
        '500':
          description: Internal server error
