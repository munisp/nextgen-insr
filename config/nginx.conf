# ─────────────────────────────────────────────────────────────────────────────
# config/nginx.conf — InsurePortal production-final reverse proxy
# (Sprint 62 / item A9, Sprint 65 / item A10)
#
# Mounted by docker-compose.production-final.yml at /etc/nginx/nginx.conf.
# Fronts the `web` service (repo-root Dockerfile, Express/tRPC on :3000):
#   /                → client SPA + tRPC batch endpoint (/api/trpc/)
#   /api/auth/       → Keycloak session auth (strict rate limit)
#   /api/metrics     → Prometheus scrape endpoint (internal clients only)
#   /health          → liveness endpoint used by compose/k8s probes
#   /socket.io/      → WebSocket upgrade
#
# TLS: hardened TLS defaults are set at http level (ssl_protocols et al.).
# The production HTTPS server block is provided at the bottom; enable it by
# mounting real certificates at /etc/nginx/ssl (see the TLS CERTIFICATES note).
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss: https:; frame-ancestors 'none';" always;
    server_tokens off;

    # ── TLS defaults (apply to any ssl server in this http context) ───────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_tx:10m      rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream: web monolith (compose service `web`, PORT 3000) ─────────────
    upstream web_backend {
        least_conn;
        server web:3000;
        keepalive 32;
    }

    # ── HTTP server (default entry; terminate TLS at the 443 block below in
    #    production once certificates are mounted) ─────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 50m;
        limit_conn conn_limit 20;

        # ── Liveness (used by compose/k8s probes; no rate limit) ─────────────
        location = /health {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Prometheus metrics — internal scrape clients only ────────────────
        location = /api/metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Static assets (long cache) ────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://web_backend;
            add_header Cache-Control "public, max-age=604800, immutable";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── tRPC API ──────────────────────────────────────────────────────────
        location /api/trpc/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Auth endpoints (strict rate limit) ───────────────────────────────
        location /api/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Transaction endpoints (POS rate limit) ────────────────────────────
        location /api/v1/transactions {
            limit_req zone=api_tx burst=10 nodelay;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (Socket.IO) ─────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Everything else: SPA + remaining API routes ───────────────────────
        location / {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Production HTTPS server ───────────────────────────────────────────────
    # TLS CERTIFICATES: mount real certificates (fullchain + key) into the
    # nginx container at /etc/nginx/ssl/insureportal.crt and
    # /etc/nginx/ssl/insureportal.key (compose: set TLS_CERTS_DIR), then
    # uncomment this block and switch the port-80 server to a 301 redirect.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name insureportal.ng www.insureportal.ng;
    #
    #     ssl_certificate     /etc/nginx/ssl/insureportal.crt;
    #     ssl_certificate_key /etc/nginx/ssl/insureportal.key;
    #     ssl_stapling        on;
    #     ssl_stapling_verify on;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     client_max_body_size 50m;
    #     limit_conn conn_limit 20;
    #
    #     location / {
    #         limit_req zone=api_general burst=20 nodelay;
    #         proxy_pass http://web_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }
    #
    # server {
    #     listen 80;
    #     server_name insureportal.ng www.insureportal.ng;
    #     return 301 https://$host$request_uri;
    # }

    # HSTS: enforced once the HTTPS block above is enabled. The header is kept
    # here (not inside `location`) so it ships on every HTTPS response.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    map $scheme $hsts_header {
        https "max-age=63072000; includeSubDomains; preload";
    }
    add_header Strict-Transport-Security $hsts_header always;
}
