openapi: '3.0.3'
info:
  title: Enhanced Kyc Kyb
  description: Enhanced KYC/KYB — comprehensive customer/business verification Business Rules: - KYC Levels: Tier 1 (BVN only, ₦300K daily), Tier 2 (BVN+NIN, ₦5M daily), Tier 3 (Full docs, unlimited)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: enhanced-kyc-kyb
                  database:
                    type: string
                    example: 'true'
  /api/v1/kyc/verify:
    post:
      summary: Verify k y c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful verify k y c
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/kyb/verify:
    post:
      summary: Verify k y b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful verify k y b
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/kyc/{id}/status:
    get:
      summary: Kyc status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful kyc status
        '400':
          description: Bad request
        '500':
          description: Internal server error
