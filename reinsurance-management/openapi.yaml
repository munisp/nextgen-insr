openapi: '3.0.3'
info:
  title: Reinsurance Management
  description: ReinsuranceService manages reinsurance operations Treaty represents a reinsurance treaty
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: reinsurance-management
                  database:
                    type: string
                    example: 'true'
  /api/reinsurance/cession:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/reinsurance/recovery:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
