# InsurePortal — Prometheus Alerting Rules
# Deploy: prometheus.yml -> rule_files: ["alerts/*.yml"]

groups:
  - name: service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_errors_total[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.instance }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency on {{ $labels.instance }}"
          description: "p99 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"

      - alert: HighLatencyP50
        expr: histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[5m])) > 0.2
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Elevated p50 latency on {{ $labels.instance }}"

  - name: database_health
    interval: 30s
    rules:
      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_activity_count > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection pool near limit"
          description: "Active connections: {{ $value }}/200"

      - alert: DatabaseSlowQueries
        expr: pg_stat_statements_mean_exec_time_ms > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow queries detected (mean > 1s)"

      - alert: DatabaseReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Replication lag exceeds 30 seconds"

      - alert: HighDeadTupleRatio
        expr: pg_stat_user_tables_n_dead_tup / (pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup) > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "High dead tuple ratio on {{ $labels.relname }}"

  - name: kafka_health
    interval: 30s
    rules:
      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer group lag high"
          description: "Consumer group {{ $labels.group }} lag: {{ $value }}"

      - alert: KafkaBrokerDown
        expr: kafka_brokers < 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker count below expected"

  - name: business_metrics
    interval: 60s
    rules:
      - alert: ClaimProcessingSLABreach
        expr: (time() - claims_last_processed_timestamp) > 172800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Claims processing SLA breach (>48h)"

      - alert: HighFraudRate
        expr: rate(fraud_alerts_total[1h]) / rate(claims_submitted_total[1h]) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Fraud alert rate exceeds 10% of claims"

      - alert: PremiumCollectionFailure
        expr: rate(premium_collection_failures_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Premium collection failures elevated"

  - name: infrastructure
    interval: 60s
    rules:
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in {{ $value | humanize }} days"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 15% on {{ $labels.mountpoint }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90%"
