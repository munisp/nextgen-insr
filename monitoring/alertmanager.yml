# ─────────────────────────────────────────────────────────────────────────────
# Alertmanager Configuration — NGApp Platform
# Covers all insurance microservices, middleware, and infrastructure
# ─────────────────────────────────────────────────────────────────────────────

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.ngapp.example.com:587"
  smtp_from: "alerts@ngapp.example.com"
  smtp_auth_username: "alerts@ngapp.example.com"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

# ── Routing tree ──────────────────────────────────────────────────────────────
route:
  receiver: "slack-info"
  group_by: ["alertname", "service", "environment", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical severity → PagerDuty/OnCall + Slack critical
    - matchers:
        - severity = "critical"
      receiver: "pagerduty-critical"
      continue: true

    - matchers:
        - severity = "critical"
      receiver: "slack-critical"

    # Warning → Slack warning channel
    - matchers:
        - severity = "warning"
      receiver: "slack-warning"

    # Fraud alerts always go to fraud channel (any severity)
    - matchers:
        - alertname =~ ".*Fraud.*|.*fraud.*"
      receiver: "slack-fraud"
      continue: true

    # Compliance alerts → compliance channel
    - matchers:
        - alertname =~ ".*CBN.*|.*naicom.*|.*ndpr.*|.*gdpr.*|.*compliance.*"
      receiver: "slack-compliance"
      continue: true

    # Finance/Payment alerts
    - matchers:
        - alertname =~ ".*Settlement.*|.*Premium.*|.*Float.*|.*Payment.*"
      receiver: "slack-finance"
      continue: true

    # Network/Telco alerts
    - matchers:
        - alertname =~ ".*SIM.*|.*Network.*|.*Telco.*|.*USSD.*"
      receiver: "slack-network"
      continue: true

# ── Inhibition rules ─────────────────────────────────────────────────────────
inhibit_rules:
  # If critical is firing, inhibit related warnings
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "service"]
  # If service is down, inhibit all derived alerts from that service
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - alertname != "ServiceDown"
    equal: ["service"]

# ── Receivers ────────────────────────────────────────────────────────────────
receivers:
  # ── Critical: PagerDuty/OnCall integration ───────────────────────────
  - name: "pagerduty-critical"
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity: critical
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'

  # ── Slack: critical channel ──────────────────────────────────────────
  - name: "slack-critical"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_CRITICAL}"
        channel: "#ngapp-critical"
        send_resolved: true
        icon_emoji: ":rotating_light:"
        username: "NGApp Alertmanager"
        title: '{{ template "slack.default.title" . }}'
        text: |
          {{ range .Alerts }}
          *🚨 CRITICAL ALERT*
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          *Environment:* {{ .Labels.environment }}
          {{ end }}
        color: danger

  # ── Slack: warning channel ───────────────────────────────────────────
  - name: "slack-warning"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_WARNING}"
        channel: "#ngapp-warnings"
        send_resolved: true
        icon_emoji: ":warning:"
        username: "NGApp Alertmanager"
        title: '{{ template "slack.default.title" . }}'
        text: |
          {{ range .Alerts }}
          *⚠️ WARNING*
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: warning

  # ── Slack: fraud alerts ──────────────────────────────────────────────
  - name: "slack-fraud"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_FRAUD}"
        channel: "#ngapp-fraud-alerts"
        send_resolved: true
        icon_emoji: ":shield:"
        username: "NGApp Fraud Monitor"
        title: ":shield: Fraud Alert — NGApp Platform"
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: danger

  # ── Slack: compliance alerts ─────────────────────────────────────────
  - name: "slack-compliance"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_COMPLIANCE}"
        channel: "#ngapp-compliance"
        send_resolved: true
        icon_emoji: ":closed_lock_with_key:"
        username: "NGApp Compliance Monitor"
        title: ":closed_lock_with_key: Compliance Alert — NGApp"
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: warning

  # ── Slack: finance alerts ────────────────────────────────────────────
  - name: "slack-finance"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_FINANCE}"
        channel: "#ngapp-finance"
        send_resolved: true
        icon_emoji: ":moneybag:"
        username: "NGApp Finance Monitor"
        title: ":moneybag: Finance Alert — NGApp"
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: warning

  # ── Slack: network/telco alerts ──────────────────────────────────────
  - name: "slack-network"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_NETWORK}"
        channel: "#ngapp-network"
        send_resolved: true
        icon_emoji: ":signal_strength:"
        username: "NGApp Network Monitor"
        title: ":signal_strength: Network Alert — NGApp"
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        color: warning

  # ── Default: info / general ──────────────────────────────────────────
  - name: "slack-info"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_INFO}"
        channel: "#ngapp-alerts"
        send_resolved: true
        icon_emoji: ":information_source:"
        username: "NGApp Alertmanager"
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

templates:
  - "/etc/alertmanager/templates/*.tmpl"
