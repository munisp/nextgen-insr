global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ngapp-staging'
    region: 'staging'

# ── Alert manager ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Alert rule files ──────────────────────────────────────────────────────────
rule_files:
  - "alerts.yml"
  - "alerts/float.rules.yml"
  - "alerts/fraud.rules.yml"
  - "alerts/sim.rules.yml"
  - "alerts/latency.rules.yml"
  - "alerts/availability.rules.yml"
  - "alerts/mdm.rules.yml"
  - "alerts/cbn.rules.yml"

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:
  # ── Core Application Services ──
  - job_name: 'insurance-portal-app'
    static_configs:
      - targets: ['portal:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 15s

  # ── Claims & Adjudication ──
  - job_name: 'claims-adjudication-engine'
    static_configs:
      - targets: ['claims-adjudication-engine:8090']
    metrics_path: '/metrics'

  - job_name: 'claims-adjudication'
    static_configs:
      - targets: ['claims-adjudication:8001']
    metrics_path: '/metrics'

  # ── Fraud Detection ──
  - job_name: 'fraud-engine'
    static_configs:
      - targets: ['fraud-engine:8085']
