openapi: 3.0.3
info:
  title: Nigerian Bank Integrations
  version: 1.0.0
  description: NUBAN validation, name enquiry, and bank transfers for Nigerian banks
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health status
  /api/v1/banks:
    get:
      summary: List supported Nigerian banks
      responses:
        '200':
          description: Bank list with codes
  /api/v1/validate-nuban:
    post:
      summary: Validate a NUBAN account number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_number, bank_code]
              properties:
                account_number: { type: string, pattern: '^\d{10}$' }
                bank_code: { type: string }
      responses:
        '200':
          description: Validation result
  /api/v1/name-enquiry:
    post:
      summary: Account name enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_number, bank_code]
              properties:
                account_number: { type: string }
                bank_code: { type: string }
      responses:
        '200':
          description: Account details
  /api/v1/transfer:
    post:
      summary: Initiate bank transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_account, destination_account, amount]
              properties:
                source_account: { type: string }
                destination_account: { type: string }
                destination_bank_code: { type: string }
                amount: { type: number }
                narration: { type: string }
      responses:
        '200':
          description: Transfer initiated
