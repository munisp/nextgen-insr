openapi: '3.0.3'
info:
  title: Nigerian Bank Integrations
  description: Nigerian Bank Integrations — unified interface for NIBSS, NIP, NUBAN validation Business Rules: - NUBAN validation: 10-digit, check digit algorithm (CBN standard)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: nigerian-bank-integrations
                  database:
                    type: string
                    example: 'true'
  /api/v1/banks:
    get:
      summary: Func
      responses:
        '200':
          description: Successful func
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/validate-nuban:
    post:
      summary: Validate n u b a n
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful validate n u b a n
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/name-enquiry:
    post:
      summary: Name enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful name enquiry
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/transfer:
    post:
      summary: Initiate transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful initiate transfer
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
