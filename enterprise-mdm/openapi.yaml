openapi: '3.0.3'
info:
  title: Enterprise Mdm
  description: Enterprise MDM — Master Data Management with golden record resolution Business Rules: - Golden record: Single source of truth for customer, policy, agent entities
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: enterprise-mdm
                  database:
                    type: string
                    example: 'true'
  /api/v1/golden-records:
    get:
      summary: List golden records
      responses:
        '200':
          description: Successful list golden records
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/deduplicate:
    post:
      summary: Find duplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful find duplicates
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/quality-score:
    get:
      summary: Data quality score
      responses:
        '200':
          description: Successful data quality score
        '400':
          description: Bad request
        '500':
          description: Internal server error
