apiVersion: v1
kind: Service
metadata:
  name: {{ include "etherisc-gif-enhanced.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: {{ include "etherisc-gif-enhanced.name" . }}
