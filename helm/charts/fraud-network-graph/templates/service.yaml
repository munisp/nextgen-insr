apiVersion: v1
kind: Service
metadata:
  name: {{ include "fraud-network-graph.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: {{ include "fraud-network-graph.name" . }}
