apiVersion: v1
kind: Service
metadata:
  name: {{ include "claims-adjudication-engine.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: {{ include "claims-adjudication-engine.name" . }}
