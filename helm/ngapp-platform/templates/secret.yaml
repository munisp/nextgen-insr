{{- /*
  secret.yaml - Secret definitions for all NGApp services
  Uses existing secrets when available, generates placeholders for development.
  NEVER commit real secrets - always use existingSecret references in production.
*/ -}}

{{- $fullName := include "ngapp.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secrets
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Database credentials */ -}}
  {{- if .Values.commonSecrets.database.existingSecret }}
  {{- /* Reference external secret - no stringData needed */ -}}
  {{- else }}
  DB_USER: "{{ .Values.postgresql.auth.username | default "ngapp" }}"
  DB_PASSWORD: "{{ .Values.commonSecrets.database.password | default "CHANGE_ME_USE_VAULT" }}"
  {{- end }}

  {{- /* Redis credentials */ -}}
  {{- if .Values.commonSecrets.redis.existingSecret }}
  {{- else }}
  REDIS_PASSWORD: "{{ .Values.commonSecrets.redis.password | default "CHANGE_ME_USE_VAULT" }}"
  {{- end }}

  {{- /* JWT secrets */ -}}
  {{- if .Values.commonSecrets.jwt.existingSecret }}
  {{- else }}
  JWT_SECRET: "{{ .Values.commonSecrets.jwt.secret | default "CHANGE_ME_USE_VAULT_STRONG_SECRET" }}"
  {{- end }}

  {{- /* Payment gateway keys */ -}}
  {{- if .Values.secrets.payment.existingSecret }}
  {{- else }}
  PAYSTACK_SECRET_KEY: "{{ .Values.commonSecrets.payment.paystackSecretKey | default "sk_live_CHANGE_ME" }}"
  FLUTTERWAVE_SECRET_KEY: "{{ .Values.commonSecrets.payment.flutterwaveSecretKey | default "FLWSECK_CHANGE_ME" }}"
  {{- end }}

  {{- /* TLS certificates */ -}}
  {{- if and .Values.global.tls.enabled .Values.global.tls.certFile .Values.global.tls.keyFile }}
  tls.crt: {{ .Values.global.tls.certFile | b64enc }}
  tls.key: {{ .Values.global.tls.keyFile | b64enc }}
  {{- end }}
