{{- /*
  deployment.yaml - Production-ready deployment template for NGApp microservices
  Handles all services with proper resource limits, probes, rolling updates, and labels.
*/ -}}

{{- $fullName := include "ngapp.fullname" . -}}

{{- range $name, $config := .Values.services }}
{{- $defaults := $.Values.serviceDefaults }}
{{- $replicas := $config.replicaCount | default $defaults.replicaCount }}
{{- $port := $config.port | default 8080 }}
{{- $memReq := (($config.resources).requests).memory | default (($defaults.resources).requests).memory }}
{{- $cpuReq := (($config.resources).requests).cpu | default (($defaults.resources).requests).cpu }}
{{- $memLim := (($config.resources).limits).memory | default (($defaults.resources).limits).memory }}
{{- $cpuLim := (($config.resources).limits).cpu | default (($defaults.resources).limits).cpu }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-{{ $name }}
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.serviceLabels" (dict "root" $ "serviceName" $name "component" "backend") | nindent 4 }}
  annotations:
    # Force rolling restart when config changes
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum | quote }}
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ $port }}"
    prometheus.io/path: "/metrics"
spec:
  {{- if not (($config.autoscaling).enabled) }}
  replicas: {{ $replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ngapp.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ngapp.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $fullName }}-{{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "ngapp.serviceImage" (dict "root" $ "serviceName" $name) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullName }}-config
            - secretRef:
                name: {{ $fullName }}-secrets
          env:
            - name: SERVICE_NAME
              value: {{ $name }}
            - name: SERVICE_PORT
              value: "{{ $port }}"
            - name: ENVIRONMENT
              value: {{ $.Values.global.environment | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              memory: {{ $memReq }}
              cpu: {{ $cpuReq }}
            limits:
              memory: {{ $memLim }}
              cpu: {{ $cpuLim }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: certs
              mountPath: /etc/ssl/certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: certs
          configMap:
            name: {{ $fullName }}-tls-certs
            optional: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "ngapp.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "ngapp.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 14 }}
{{- end }}
