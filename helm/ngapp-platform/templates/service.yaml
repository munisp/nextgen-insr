{{- /*
  service.yaml - Service definitions for all NGApp microservices
  Creates ClusterIP services for internal communication.
  Can enable NodePort or LoadBalancer per service via values.
*/ -}}

{{- $fullName := include "ngapp.fullname" . -}}

{{- range $name, $config := .Values.services }}
{{- $port := $config.port | default 8080 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-{{ $name }}
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.serviceLabels" (dict "root" $ "serviceName" $name "component" "backend") | nindent 4 }}
  annotations:
    # Prometheus service discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ $port }}"
spec:
  type: {{ $config.serviceType | default "ClusterIP" }}
  ports:
    - port: {{ $port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq $config.serviceType "NodePort") $config.nodePort }}
      nodePort: {{ $config.nodePort }}
      {{- end }}
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "ngapp.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 4 }}
{{- end }}

{{- /* Frontend service */ -}}
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-frontend
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.serviceLabels" (dict "root" $ "serviceName" "frontend" "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ngapp.serviceSelectorLabels" (dict "root" $ "serviceName" "frontend") | nindent 4 }}
{{- end }}

{{- /* APISIX API Gateway service */ -}}
{{- if .Values.apiGateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-apisix
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.serviceLabels" (dict "root" $ "serviceName" "apisix" "component" "gateway") | nindent 4 }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.apiGateway.service.port }}
      targetPort: 9080
      protocol: TCP
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
    - name: admin
      port: {{ .Values.apiGateway.service.adminPort }}
      targetPort: 9180
      protocol: TCP
      {{- if eq .Values.apiGateway.service.type "NodePort" }}
      nodePort: 30180
      {{- end }}
  selector:
    {{- include "ngapp.serviceSelectorLabels" (dict "root" $ "serviceName" "apisix") | nindent 4 }}
{{- end }}
