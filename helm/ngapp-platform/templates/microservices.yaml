{{- /*
  microservices.yaml - ServiceAccounts for all NGApp microservices
  Each service gets its own ServiceAccount for fine-grained RBAC.
*/ -}}

{{- $fullName := include "ngapp.fullname" . -}}

{{- range $name, $config := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}-{{ $name }}
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.serviceLabels" (dict "root" $ "serviceName" $name "component" "backend") | nindent 4 }}
  annotations:
    {{- if $.Values.serviceMesh.enabled }}
    sidecar.istio.io/inject: "true"
    {{- end }}
{{- end }}

{{- /* Frontend ServiceAccount */ -}}
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}-frontend
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.labels" . | nindent 4 }}
{{- end }}

{{- /* APISIX ServiceAccount */ -}}
{{- if .Values.apiGateway.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}-apisix
  namespace: {{ include "ngapp.namespace" . }}
  labels:
    {{- include "ngapp.labels" . | nindent 4 }}
{{- end }}
