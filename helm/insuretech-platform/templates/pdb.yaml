{{- /*
  pdb.yaml - PodDisruptionBudgets for all InsureTech services
  Ensures minimum availability during voluntary disruptions (upgrades, scaling).
*/ -}}

{{- $fullName := include "insuretech.fullname" . -}}

{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $config := .Values.services }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullName }}-{{ $name }}
  # 2026-11-28 (helm-render fix): inside `range` the dot is the element, not root — pass $ so the helper sees .Release/.Values.
  namespace: {{ include "insuretech.namespace" $ }}
  labels:
    {{- include "insuretech.serviceLabels" (dict "root" $ "serviceName" $name "component" "backend") | nindent 4 }}
spec:
  {{- /* 2026-11-28 (helm-render fix): guard $config.pdb with the chart's nil-safe idiom (parenthesized chain) — services without a pdb: key nil-derefed here. */ -}}
  {{- if ($config.pdb).minAvailable }}
  minAvailable: {{ $config.pdb.minAvailable }}
  {{- else }}
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if ($config.pdb).maxUnavailable }}
  maxUnavailable: {{ $config.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "insuretech.serviceSelectorLabels" (dict "root" $ "serviceName" $name) | nindent 6 }}
{{- end }}

{{- /* Frontend PDB */ -}}
{{- if .Values.frontend.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullName }}-frontend
  namespace: {{ include "insuretech.namespace" . }}
  labels:
    {{- include "insuretech.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.frontend.pdbMinAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "insuretech.serviceSelectorLabels" (dict "root" $ "serviceName" "frontend") | nindent 6 }}
{{- end }}

{{- /* APISIX PDB */ -}}
{{- if .Values.apiGateway.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullName }}-apisix
  namespace: {{ include "insuretech.namespace" . }}
  labels:
    {{- include "insuretech.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "insuretech.serviceSelectorLabels" (dict "root" $ "serviceName" "apisix") | nindent 6 }}
{{- end }}
{{- end }}
