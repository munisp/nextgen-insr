openapi: '3.0.3'
info:
  title: Etherisc Gif Integration
  description: Etherisc GIF Integration — decentralized insurance protocol connector Business Rules: - Products: Parametric crop insurance, flight delay, weather index
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: etherisc-gif-integration
                  database:
                    type: string
                    example: 'true'
  /api/v1/products:
    get:
      summary: Func
      responses:
        '200':
          description: Successful func
        '400':
          description: Bad request
        '500':
          description: Internal server error
