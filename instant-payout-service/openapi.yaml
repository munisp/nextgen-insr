openapi: '3.0.3'
info:
  title: Instant Payout Service
  description: Instant Payout Service — real-time claim settlements and agent payouts Business Rules: - Instant payout: Claims ≤ ₦500K settled within 15 minutes
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: instant-payout-service
                  database:
                    type: string
                    example: 'true'
  /api/v1/payout:
    post:
      summary: Initiate payout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful initiate payout
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/payout/{id}/status:
    get:
      summary: Payout status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful payout status
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/float:
    get:
      summary: Float status
      responses:
        '200':
          description: Successful float status
        '400':
          description: Bad request
        '500':
          description: Internal server error
