[package]
name = "insureportal-rust-middleware"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust middleware for InsurePortal: audit pipeline, rate limiting, WAF bridge, Kafka consumer"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1.8", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dashmap = "5.5"
governor = "0.6"
nonzero_ext = "0.3"
prometheus = { version = "0.13", features = ["process"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
regex = "1.10"
once_cell = "1.19"
bytes = "1.6"
futures = "0.3"
async-trait = "0.1"
config = "0.14"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bin]]
name = "rust-middleware"
path = "src/main.rs"
