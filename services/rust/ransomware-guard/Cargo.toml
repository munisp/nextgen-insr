[package]
name = "ransomware-guard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ransomware-guard"
path = "src/main.rs"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
walkdir = "2"
notify-debouncer-mini = "0.4"
log = "0.4"
env_logger = "0.10"
