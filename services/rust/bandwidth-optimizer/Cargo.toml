[package]
name = "bandwidth-optimizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bandwidth-optimizer"
path = "src/main.rs"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
log = "0.4"
env_logger = "0.10"
