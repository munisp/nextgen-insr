[package]
name = "smart-contract-oracle"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
log = "0.4"
env_logger = "0.10"
tokio-postgres = "0.7"
hex = "0.4"
rand = "0.8"
