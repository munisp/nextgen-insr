[package]
name = "ledger-sidecar"
version = "0.1.0"
edition = "2021"
description = "High-performance ledger sidecar for TigerBeetle integration"

[dependencies]
actix-web = "4.14"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rdkafka = { version = "0.39", features = ["cmake-build"] }
redis = { version = "1.4", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
anyhow = "1"
thiserror = "1"
