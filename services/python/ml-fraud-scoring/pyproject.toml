[project]
name = "ml-fraud-scoring"
version = "0.1.0"
description = "ML-powered fraud detection scoring service for insurance claims"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "confluent-kafka>=2.3.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "joblib>=1.3.0",
]

[tool.setuptools]
packages = ["app", "models"]
