[project]
name = "cv-claims-adjuster"
version = "0.1.0"
description = "Computer vision service for automated vehicle damage assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "confluent-kafka>=2.3.0",
    "python-multipart>=0.0.9",
    "opentelemetry-api>=1.24.0",
]

[tool.setuptools]
packages = ["app", "models"]
