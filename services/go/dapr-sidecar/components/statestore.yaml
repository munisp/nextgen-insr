# Dapr state store component — mirrors k8s/charts/dapr (W4) and
# k8s/middleware/dapr.yaml: same component name ("statestore"), same type
# (state.redis), same secret layout. Apply with:
#   kubectl apply -f components/ -n insurance-platform
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: insurance-platform
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-cluster.middleware.svc.cluster.local:6379
    - name: redisPassword
      secretKeyRef:
        name: redis-credentials
        key: password
    - name: enableTLS
      value: "false"
    - name: actorStateStore
      value: "true"
