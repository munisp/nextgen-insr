openapi: '3.0.3'
info:
  title: Performance Monitoring Dashboard
  description: Performance Monitoring Dashboard — real-time system and business metrics Integrates with: Prometheus, OpenSearch, Kafka (consumer lag), Redis (cache hit ratio) Business Rules:
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: performance-monitoring-dashboard
                  database:
                    type: string
                    example: 'true'
  /api/v1/metrics/system:
    get:
      summary: System metrics
      responses:
        '200':
          description: Successful system metrics
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/metrics/business:
    get:
      summary: Business metrics
      responses:
        '200':
          description: Successful business metrics
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/metrics/sla:
    get:
      summary: Sla status
      responses:
        '200':
          description: Successful sla status
        '400':
          description: Bad request
        '500':
          description: Internal server error
