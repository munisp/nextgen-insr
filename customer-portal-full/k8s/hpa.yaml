apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insureportal
  namespace: insureportal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insureportal
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: insureportal
  namespace: insureportal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: insureportal
