# APISIX API Gateway Configuration
# Routes all traffic through APISIX with JWT validation, rate limiting, and traffic mirroring

apisix:
  node_listen: 9080
  admin_listen:
    ip: 0.0.0.0
    port: 9180
  ssl:
    enable: true
    listen:
      - port: 9443

deployment:
  admin:
    admin_key:
      - name: admin
        key: "${APISIX_ADMIN_KEY}"
        role: admin

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091

plugins:
  - jwt-auth
  - key-auth
  - cors
  - limit-req
  - limit-count
  - prometheus
  - proxy-rewrite
  - ip-restriction
  - traffic-split
  - response-rewrite
  - serverless-pre-function

etcd:
  host:
    - "http://etcd:2379"
  prefix: "/apisix"
