openapi: '3.0.3'
info:
  title: Communication Service
  description: Communication Service Multi-channel notification delivery: SMS, Email, Push, WhatsApp, USSD. Integrates with: Kafka (event-driven), Redis (deduplication), Postgres (templates)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: communication-service
                  database:
                    type: string
                    example: 'true'
  /api/v1/send:
    get:
      summary: send
      responses:
        '200':
          description: Successful send
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/templates:
    get:
      summary: templates
      responses:
        '200':
          description: Successful templates
        '400':
          description: Bad request
        '500':
          description: Internal server error
