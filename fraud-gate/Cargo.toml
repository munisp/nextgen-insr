[package]
name = "fraud-gate"
version = "1.0.0"
edition = "2021"
description = "Real-time fraud detection gate for NextGen Insurance fund flows"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-postgres = "0.7"
