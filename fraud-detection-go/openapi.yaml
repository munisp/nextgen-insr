openapi: '3.0.3'
info:
  title: Fraud Detection Go
  description: Fraud Detection (Go) — real-time transaction fraud scoring Business Rules: - Score range: 0-100 (0=legitimate, 100=certain fraud)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: fraud-detection-go
                  database:
                    type: string
                    example: 'true'
  /api/v1/score:
    post:
      summary: Score transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful score transaction
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/rules:
    get:
      summary: Get rules
      responses:
        '200':
          description: Successful get rules
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/stats:
    get:
      summary: Get stats
      responses:
        '200':
          description: Successful get stats
        '400':
          description: Bad request
        '500':
          description: Internal server error
