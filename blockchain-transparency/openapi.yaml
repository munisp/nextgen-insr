openapi: '3.0.3'
info:
  title: Blockchain Transparency
  description: Blockchain Transparency — immutable audit trail and parametric trigger verification Business Rules: - Smart contracts: Parametric insurance triggers (weather, flight delay)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: blockchain-transparency
                  database:
                    type: string
                    example: 'true'
  /api/v1/record:
    post:
      summary: Record on chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful record on chain
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/verify/{hash}:
    get:
      summary: Verify record
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful verify record
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/contracts:
    get:
      summary: List contracts
      responses:
        '200':
          description: Successful list contracts
        '400':
          description: Bad request
        '500':
          description: Internal server error
