openapi: '3.0.3'
info:
  title: Policy Lifecycle Service
  description: Policy Lifecycle Service Manages the full insurance policy lifecycle: quote → bind → issue → endorse → renew → cancel → lapse Integrates with: Postgres, Kafka, TigerBeetle, Temporal
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: policy-lifecycle-service
                  database:
                    type: string
                    example: 'true'
  /api/v1/transition:
    get:
      summary: transition
      responses:
        '200':
          description: Successful transition
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/transitions:
    get:
      summary: transitions
      responses:
        '200':
          description: Successful transitions
        '400':
          description: Bad request
        '500':
          description: Internal server error
