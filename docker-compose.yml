# =============================================================================
# NextGen InsurePortal — Insurance Platform Docker Compose
# Polyglot: TypeScript (API/Temporal) | Go (Ledger/Gateway) | Rust (Fraud/Streaming) | Python (AI/ML/Actuarial)
# Insurance Platform — Clean docker-compose
# =============================================================================

version: "3.9"

networks:
  insureportal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  temporal_data:
  tigerbeetle_data:
  opensearch_data:
  fluvio_data:

services:

  # ── PostgreSQL (Primary DB) ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: insureportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insureportal
      POSTGRES_USER: insureportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insureportal_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - insureportal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureportal -d insureportal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: insureportal-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - insureportal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── TigerBeetle ────────────────────────────────────────────────────────────
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.11
    container_name: insureportal-tigerbeetle
    restart: unless-stopped
    volumes:
      - tigerbeetle_data:/data
    command: start --addresses=0.0.0.0:3000 /data/insureportal.tigerbeetle
    ports:
      - "3001:3000"
    networks:
      - insureportal

  # ── Temporal ───────────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: insureportal-temporal
    restart: unless-stopped
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: insureportal
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-insureportal_dev}
      POSTGRES_SEEDS: postgres
      TEMPORAL_NAMESPACE: insureportal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    networks:
      - insureportal

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: insureportal-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    networks:
      - insureportal

  # ── Fluvio ─────────────────────────────────────────────────────────────────
  fluvio-sc:
    image: infinyon/fluvio:latest
    container_name: insureportal-fluvio-sc
    restart: unless-stopped
    command: fluvio-run sc --local /fluvio/metadata
    volumes:
      - fluvio_data:/fluvio
    ports:
      - "9003:9003"
    networks:
      - insureportal

  fluvio-spu:
    image: infinyon/fluvio:latest
    container_name: insureportal-fluvio-spu
    restart: unless-stopped
    command: fluvio-run spu -i 5001 -p 0.0.0.0:9010 -v 0.0.0.0:9011 --sc-addr fluvio-sc:9004
    depends_on:
      - fluvio-sc
    ports:
      - "9010:9010"
    networks:
      - insureportal

  fluvio-init:
    image: infinyon/fluvio:latest
    container_name: insureportal-fluvio-init
    restart: "no"
    depends_on:
      - fluvio-sc
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15 &&
        fluvio profile add docker fluvio-sc:9003 docker 2>/dev/null || true &&
        for topic in policy-events claims-events fraud-events payment-events agent-events kyc-events compliance-events renewal-events commission-events remittance-events underwriting-events reinsurance-events platform-events audit-events; do
          fluvio topic create $$topic --partitions 6 --replication 1 2>/dev/null || true
        done &&
        echo "Insurance platform Fluvio topics initialized"
    networks:
      - insureportal

  # ── MinIO (Lakehouse) ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: insureportal-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-insureportal}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-insureportal_dev}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - insureportal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Keycloak ───────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: insureportal-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/insureportal
      KC_DB_USERNAME: insureportal
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-insureportal_dev}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - insureportal

  # ── Permify ────────────────────────────────────────────────────────────────
  permify:
    image: ghcr.io/permify/permify:latest
    container_name: insureportal-permify
    restart: unless-stopped
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3476:3476"
    networks:
      - insureportal

  # ── APISIX ─────────────────────────────────────────────────────────────────
  apisix-etcd:
    image: bitnami/etcd:3.5.12
    container_name: insureportal-apisix-etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://apisix-etcd:2379
    ports:
      - "2379:2379"
    networks:
      - insureportal

  apisix:
    image: apache/apisix:3.9.0-debian
    container_name: insureportal-apisix
    restart: unless-stopped
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - apisix-etcd
    ports:
      - "9080:9080"
      - "9180:9180"
    networks:
      - insureportal

  # ── Dapr ───────────────────────────────────────────────────────────────────
  dapr-placement:
    image: daprio/dapr:1.13.0
    container_name: insureportal-dapr-placement
    restart: unless-stopped
    command: ./placement -port 50006
    ports:
      - "50006:50006"
    networks:
      - insureportal

  # ── OpenAppSec ─────────────────────────────────────────────────────────────
  openappsec-agent:
    image: ghcr.io/openappsec/agent:latest
    container_name: insureportal-openappsec
    restart: unless-stopped
    environment:
      OPENAPPSEC_TOKEN: ${OPENAPPSEC_TOKEN:-dev_token}
    networks:
      - insureportal
    ports:
      - "80:80"

  # ── OpenSearch ─────────────────────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: insureportal-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - insureportal

  # ── Ollama (AI/LLM CPU Inference) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: insureportal-ollama
    restart: unless-stopped
    volumes:
      - ./infra/ollama/models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - insureportal

  # ── TigerBeetle Sidecar (Go) ───────────────────────────────────────────────
  insureportal-tb-sidecar:
    build:
      context: ./tb-sidecar
      dockerfile: Dockerfile
    container_name: insureportal-tb-sidecar
    restart: unless-stopped
    environment:
      TB_ADDRESS: tigerbeetle:3000
      POSTGRES_DSN: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      PORT: "7070"
    depends_on:
      - tigerbeetle
      - postgres
    ports:
      - "7070:7070"
    networks:
      - insureportal

  # ── Payment Gateway (Go) ───────────────────────────────────────────────────
  insureportal-payment-gateway:
    build:
      context: ./services/go/payment-gateway
      dockerfile: Dockerfile
    container_name: insureportal-payment-gateway
    restart: unless-stopped
    environment:
      PORT: "8100"
      POSTGRES_DSN: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      TIGERBEETLE_URL: http://insureportal-tb-sidecar:7070
      TEMPORAL_ADDRESS: temporal:7233
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
    depends_on:
      - postgres
      - redis
      - insureportal-tb-sidecar
    ports:
      - "8100:8100"
    networks:
      - insureportal

  # ── Float Reconciliation Engine (Go) ──────────────────────────────────────
  insureportal-float-reconciler:
    build:
      context: ./services/go/float-reconciler
      dockerfile: Dockerfile
    container_name: insureportal-float-reconciler
    restart: unless-stopped
    environment:
      PORT: "8101"
      POSTGRES_DSN: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      TIGERBEETLE_URL: http://insureportal-tb-sidecar:7070
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      RECONCILE_INTERVAL: "300s"
    depends_on:
      - postgres
      - insureportal-tb-sidecar
    ports:
      - "8101:8101"
    networks:
      - insureportal

  # ── Fraud Gate (Rust) ─────────────────────────────────────────────────────
  insureportal-fraud-gate:
    build:
      context: ./fraud-gate
      dockerfile: Dockerfile
    container_name: insureportal-fraud-gate
    restart: unless-stopped
    environment:
      PORT: "8090"
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      FLUVIO_URL: fluvio-sc:9003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"
    networks:
      - insureportal

  # ── Ledger Sidecar (Rust) ─────────────────────────────────────────────────
  insureportal-ledger-sidecar:
    build:
      context: ./services/rust/ledger-sidecar
      dockerfile: Dockerfile
    container_name: insureportal-ledger-sidecar
    restart: unless-stopped
    environment:
      PORT: "8091"
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      TIGERBEETLE_ADDRESS: tigerbeetle:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8091:8091"
    networks:
      - insureportal

  # ── ML Fraud Scoring (Python) ─────────────────────────────────────────────
  insureportal-ml-fraud:
    build:
      context: ./services/python/ml-fraud-scoring
      dockerfile: Dockerfile
    container_name: insureportal-ml-fraud
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - insureportal

  # ── KYC Verification (Python) ─────────────────────────────────────────────
  insureportal-kyc:
    build:
      context: ./services/python/kyc-verification
      dockerfile: Dockerfile
    container_name: insureportal-kyc
    restart: unless-stopped
    environment:
      PORT: "8001"
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      NIBSS_API_URL: ${NIBSS_API_URL:-https://nibss-api.ng/v1}
      NIBSS_API_KEY: ${NIBSS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    networks:
      - insureportal

  # ── Actuarial Engine (Python) ─────────────────────────────────────────────
  insureportal-actuarial:
    build:
      context: ./actuarial-platform
      dockerfile: Dockerfile
    container_name: insureportal-actuarial
    restart: unless-stopped
    environment:
      PORT: "8002"
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-insureportal}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-insureportal_dev}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"
    networks:
      - insureportal

  # ── Claims Adjudication AI (Python) ──────────────────────────────────────
  insureportal-claims-ai:
    build:
      context: ./services/python/claims-adjudication
      dockerfile: Dockerfile
    container_name: insureportal-claims-ai
    restart: unless-stopped
    environment:
      PORT: "8003"
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8003"
    networks:
      - insureportal

  # ── AI Advisor (Python) ───────────────────────────────────────────────────
  insureportal-ai-advisor:
    build:
      context: ./services/python/ai-advisor
      dockerfile: Dockerfile
    container_name: insureportal-ai-advisor
    restart: unless-stopped
    environment:
      PORT: "8004"
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      OLLAMA_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8004"
    networks:
      - insureportal

  # ── Main InsurePortal API (TypeScript/tRPC) ────────────────────────────────
  insureportal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insureportal-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: insureportal
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: insureportal
      PERMIFY_URL: http://permify:3476
      TIGERBEETLE_URL: http://insureportal-tb-sidecar:7070
      FLUVIO_URL: fluvio-sc:9003
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-insureportal}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-insureportal_dev}
      OLLAMA_URL: http://ollama:11434
      DAPR_URL: http://dapr-placement:3500
      APISIX_ADMIN_URL: http://apisix:9180
      FRAUD_GATE_URL: http://insureportal-fraud-gate:8090
      ML_FRAUD_URL: http://insureportal-ml-fraud:8000
      KYC_SERVICE_URL: http://insureportal-kyc:8001
      ACTUARIAL_URL: http://insureportal-actuarial:8002
      PAYMENT_GATEWAY_URL: http://insureportal-payment-gateway:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - insureportal

  # ── Temporal Worker (TypeScript) ──────────────────────────────────────────
  insureportal-temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile.temporal-worker
    container_name: insureportal-temporal-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://insureportal:${POSTGRES_PASSWORD:-insureportal_dev}@postgres:5432/insureportal
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: insureportal
      TEMPORAL_TASK_QUEUE: insureportal-journeys
      TIGERBEETLE_URL: http://insureportal-tb-sidecar:7070
      FLUVIO_URL: fluvio-sc:9003
      OLLAMA_URL: http://ollama:11434
      FRAUD_GATE_URL: http://insureportal-fraud-gate:8090
      ML_FRAUD_URL: http://insureportal-ml-fraud:8000
      KYC_SERVICE_URL: http://insureportal-kyc:8001
      ACTUARIAL_URL: http://insureportal-actuarial:8002
    depends_on:
      - temporal
      - postgres
      - redis
    networks:
      - insureportal

  # ── Frontend (React/TypeScript) ───────────────────────────────────────────
  insureportal-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: insureportal-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://insureportal-api:5000
      VITE_KEYCLOAK_URL: http://keycloak:8080
      VITE_KEYCLOAK_REALM: insureportal
    depends_on:
      - insureportal-api
    ports:
      - "3000:3000"
    networks:
      - insureportal
