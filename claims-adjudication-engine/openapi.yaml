openapi: '3.0.3'
info:
  title: Claims Adjudication Engine
  description: Claims Adjudication Engine Automated claims processing with rule-based decisioning. Integrates with: Kafka (events), Postgres (persistence), Redis (caching), Temporal (workflows)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: claims-adjudication-engine
                  database:
                    type: string
                    example: 'true'
  /api/v1/adjudicate:
    get:
      summary: adjudicate
      responses:
        '200':
          description: Successful adjudicate
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/metrics:
    get:
      summary: metrics
      responses:
        '200':
          description: Successful metrics
        '400':
          description: Bad request
        '500':
          description: Internal server error
