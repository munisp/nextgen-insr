openapi: 3.0.3
info:
  title: Claims Adjudication Engine
  version: 1.0.0
  description: Automated claims adjudication with risk scoring and fraud detection
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  database: { type: string }
                  kafka: { type: string }
  /api/v1/adjudicate:
    post:
      summary: Adjudicate a claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_id, amount, policy_id, claim_type]
              properties:
                claim_id: { type: string }
                amount: { type: number }
                policy_id: { type: string }
                claim_type: { type: string }
                evidence_count: { type: integer }
      responses:
        '200':
          description: Adjudication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim_id: { type: string }
                  decision: { type: string, enum: [approved, escalated, denied] }
                  risk_score: { type: number }
                  reason: { type: string }
  /api/v1/metrics:
    get:
      summary: Get adjudication metrics
      responses:
        '200':
          description: Processing metrics
