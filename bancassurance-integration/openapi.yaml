openapi: '3.0.3'
info:
  title: Bancassurance Integration
  description: BancassuranceService handles bank-insurance integration BankPartner represents a bank partner BankCustomer represents a bank customer for insurance
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: bancassurance-integration
                  database:
                    type: string
                    example: 'true'
  /api/bancassurance/offer:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/bancassurance/loan-protection:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
