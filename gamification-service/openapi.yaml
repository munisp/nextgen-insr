openapi: '3.0.3'
info:
  title: Gamification Service
  description: Gamification Service — engagement through points, badges, and leaderboards Business Rules: - Points: Policy purchase (100), claim-free year (500), referral (200), document upload (50)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: gamification-service
                  database:
                    type: string
                    example: 'true'
  /api/v1/points/{userId}:
    get:
      summary: Get user points
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful get user points
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/points/award:
    post:
      summary: Award points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful award points
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/leaderboard:
    get:
      summary: Get leaderboard
      responses:
        '200':
          description: Successful get leaderboard
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/badges/{userId}:
    get:
      summary: Get user badges
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful get user badges
        '400':
          description: Bad request
        '500':
          description: Internal server error
