name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write  # required for github/codeql-action/upload-sarif (semgrep)
  actions: read

jobs:
  # ── Go Static Analysis: vet + gosec ─────────────────────────────────
  go-static-analysis:
    name: Go Static Analysis
    runs-on: ubuntu-24.04  # 2026-11-26 (W22): pinned from ubuntu-latest (rolling to ubuntu-26.04 — W15 failure class); no apt-installed packages in this job, safe on noble
    timeout-minutes: 20
    strategy:
      matrix:
        module:
          - claims-adjudication-engine
          - fraud-detection-go
          - ussd-gateway
          - enhanced-kyc-kyb
          - enterprise-mdm
          - disaster-recovery-module
          - naicom-compliance-module
          - ab-testing-framework
          - agent-commission-management
          - audit-trail-system
          - bancassurance-integration
          - batch-processing-engine
          - customer-360-view
          - gdpr-compliance
          - group-life-admin
          - native-mobile-ios
          - ndpr-compliance
          - nmid-integration
          - performance-monitoring-dashboard
          - pfa-integration
          - policy-renewal-automation
          - reinsurance-management
          - strategic-implementations
          - insurance-tech-innovations
          - blockchain-transparency
          - microinsurance-engine
          - takaful-module
          - instant-payout-service
          - cross-company-fraud-database
          - dr-ha-service
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8  # v1: workflow config uses v1-only linters (go, deadcode, varcheck...) removed/renamed in v2

      - name: Install gosec
        # 2026-11-26 (W22): pinned — latest release v2.30.0, published 2026-10-23
        # (github.com/securego/gosec/releases/tag/v2.30.0)
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: golangci-lint
        working-directory: ${{ matrix.module }}
        # --disable=unused (assurance-lead approved 2026-08-16, see ci-evidence.md):
        # (1) 'unused' is a golangci-lint DEFAULT rider, NOT in the author's
        #     explicit --enable set (errcheck,gosimple,govet,staticcheck) — gate
        #     intent preserved; (2) staticcheck-unused reachability is proven
        #     unreliable on this codebase (e.g. (*rateLimiter).allow called inside
        #     mounted middleware, naicom-compliance-module main.go:146, template
        #     duplicated across ~15 modules — 147 such false-positive candidates
        #     vs 154 genuinely-dead findings); (3) genuine dead code already
        #     drained by the AST deleter where safe (revert-guaranteed);
        # (4) re-enable recommendation: revisit after upstream unused-analysis
        #     improves or a one-time vetted manual pass.
        run: golangci-lint run --timeout=5m --enable=errcheck,gosimple,govet,staticcheck --disable=unused

      - name: gosec (SAST)
        working-directory: ${{ matrix.module }}
        run: gosec -exclude-generated -severity=high -confidence=high ./...

  # ── Dependency Vulnerability Scanning ─────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04  # 2026-11-26 (W22): pinned from ubuntu-latest (rolling to ubuntu-26.04 — W15 failure class); no apt-installed packages in this job, safe on noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install govulncheck
        # 2026-11-26 (W22): pinned — proxy.golang.org/golang.org/x/vuln/@latest =
        # v1.10.0 (tag refs/tags/v1.10.0, 2026-11-17)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: govulncheck (Go services)
        run: |
          set -euo pipefail
          FOUND_ISSUES=0
          for dir in $(find . -maxdepth 2 -name "go.mod" -not -path "*/node_modules/*" -exec dirname {} \; | head -20); do
            echo "=== govulncheck: $dir ==="
            if (cd "$dir" && GONOSUMCHECK=* govulncheck ./... 2>&1); then
              echo "OK: $dir"
            else
              echo "WARN: vulnerabilities found in $dir (review above)"
              FOUND_ISSUES=1
            fi
          done
          if [ "$FOUND_ISSUES" -eq 1 ]; then
            echo "::warning::Some Go modules have known vulnerabilities. Review govulncheck output above."
          fi

      - name: npm audit (frontend)
        run: |
          echo "=== npm audit (frontend) ==="
          npm audit --audit-level=high --omit=dev 2>&1 || echo "::warning::npm audit found issues (review above)"

      - name: pip safety check (Python services)
        run: |
          # 2026-11-26 (W22): safety pinned — PyPI info.version = 3.8.1
          pip install safety==3.8.1
          for svc in ifrs17-engine mlops-governance; do
            if [ -f "$svc/requirements.txt" ]; then
              echo "=== safety check: $svc ==="
              safety check -r "$svc/requirements.txt" --json 2>&1 || echo "::warning::safety found issues in $svc"
            fi
          done

  # ── SAST: Semgrep ────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04  # 2026-11-26 (W22): pinned from ubuntu-latest (rolling to ubuntu-26.04 — W15 failure class); no apt-installed packages in this job, safe on noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        # 2026-11-26 (W22): pinned — PyPI info.version = 1.187.0
        run: pip install semgrep==1.187.0

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --config p/owasp-top-ten \
            --config p/golang \
            --config p/python \
            --config p/javascript \
            --exclude node_modules \
            --exclude vendor \
            --exclude .git \
            --sarif -o semgrep-results.sarif \
            . 

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ── Secret Scanning: gitleaks ────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04  # 2026-11-26 (W22): pinned from ubuntu-latest (rolling to ubuntu-26.04 — W15 failure class); no apt-installed packages in this job, safe on noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # 2026-11-26 (W23): 8.21.2 -> 8.24.3, harmonized with security.yml (W16
          # GITLEAKS_VERSION pin). 8.24.3 is the version under which the W15
          # .gitleaksignore fingerprints were verified; the skew meant this job
          # scanned with different rules than the W16 job. Asset URL pattern
          # (v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz) verified live via HTTP 302
          # on the GitHub release asset.
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /usr/local/bin
          gitleaks version

      - name: gitleaks detect (full repo scan)
        run: gitleaks detect --report-path=gitleaks-results.json --report-format=json --verbose --no-git 

      - name: gitleaks protect (on recent changes)
        run: gitleaks protect --report-path=gitleaks-protect-results.json --report-format=json --verbose  # protect has no --no-git flag

      - name: Custom secret patterns fallback
        run: |
          echo "=== Custom pattern check (fallback) ==="
          FOUND=0
          if grep -rn "AKIA[0-9A-Z]\{16\}" --include="*.ts" --include="*.go" --include="*.py" . 2>/dev/null; then FOUND=1; fi
          if grep -rn "sk_live_" --include="*.ts" --include="*.go" . 2>/dev/null; then FOUND=1; fi
          if grep -rn "BEGIN.*PRIVATE KEY" --include="*.ts" --include="*.go" --include="*.py" . 2>/dev/null; then FOUND=1; fi
          if grep -rn "password\s*=\s*['\"]" --include="*.go" --include="*.py" --include="*.ts" . 2>/dev/null | grep -v "test\|\.test\." | grep -v "node_modules"; then FOUND=1; fi
          if [ $FOUND -eq 0 ]; then
            echo "No hardcoded secrets detected by custom patterns"
          else
            echo "Potential secrets found — review above"
            echo "::warning::Custom secret scan found potential secrets. Investigate the lines above."
          fi

      - name: Upload gitleaks results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: |
            gitleaks-results.json
            gitleaks-protect-results.json
          retention-days: 30

  # ── License Compliance ───────────────────────────────────────────────
  license-check:
    name: License Compliance
    runs-on: ubuntu-24.04  # 2026-11-26 (W22): pinned from ubuntu-latest (rolling to ubuntu-26.04 — W15 failure class); no apt-installed packages in this job, safe on noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: License checker (frontend)
        run: |
          # 2026-11-26 (W22): license-checker pinned — npm registry /license-checker/latest = 25.0.1
          npx --yes license-checker@25.0.1 --production --summary --failOn "AGPL-3.0|GPL-3.0|SSPL-1.0" 2>&1 || echo "::warning::license-checker found issues"

      - name: npm audit (known-vulnerable packages)
        run: |
          echo "=== npm audit for known-vulnerable packages ==="
          npm audit --json 2>&1 | head -200 || echo "npm audit completed"

      - name: Check Go licenses
        run: |
          # 2026-11-26 (W22): pinned to v1.6.0 — what @latest resolves to today
          # (proxy.golang.org/github.com/google/go-licenses/@latest = v1.6.0,
          # 2023-01-16). Root module is the v1 line; the v2 module
          # (github.com/google/go-licenses/v2, latest v2.0.1 2025-09-08) is a
          # different CLI — upgrading it is out of scope for a pure pin.
          go install github.com/google/go-licenses@v1.6.0
          FOUND_PROHIBITIVE=0
          for dir in $(find . -maxdepth 1 -name "go.mod" -exec dirname {} \; | head -10); do
            echo "=== $dir ==="
            if (cd "$dir" && GONOSUMCHECK=* go-licenses check ./... 2>&1); then
              echo "OK: $dir licenses clean"
            else
              echo "WARN: license issues in $dir (review above)"
              FOUND_PROHIBITIVE=1
            fi
          done
          if [ "$FOUND_PROHIBITIVE" -eq 1 ]; then
            echo "::warning::Some Go modules have license compliance issues. Review go-licenses output above."
          fi

      - name: pip license check (Python services)
        run: |
          # 2026-11-26 (W22): pinned — PyPI info.version: license-expression 30.4.4,
          # pip-licenses 5.5.5
          pip install license-expression==30.4.4 pip-licenses==5.5.5
          for svc in ifrs17-engine mlops-governance; do
            if [ -f "$svc/requirements.txt" ]; then
              echo "=== pip-licenses: $svc ==="
              pip-licenses -r "$svc/requirements.txt" --format=json 2>/dev/null || echo "No licenses data for $svc"
            fi
          done

  # ── Trivy: container & filesystem scan ───────────────────────────────
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-24.04  # 2026-11-26 (W22): pinned from ubuntu-latest (rolling to ubuntu-26.04 — W15 failure class); no apt-installed packages in this job, safe on noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        # 2026-11-26 (W21): was floating on @master (supply-chain risk); pinned to
        # latest release v0.36.0 (published 2026-04-22, commit ed142fd0673e97e23eac54620cfb913e5ce36c25)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # 2026-11-26 (W21): pin trivy binary version explicitly (v0.36.0 default is v0.70.0)
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

