name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # ── Static Application Security Testing ──
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config p/owasp-top-ten \
            --exclude node_modules \
            --sarif -o semgrep-results.sarif \
            customer-portal-full || true

  # ── Secret Scanning ──
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Custom secret patterns
        run: |
          echo "Checking for hardcoded secrets..."
          FOUND=0
          if grep -rn "AKIA[0-9A-Z]\{16\}" --include="*.js" --include="*.cjs" --include="*.ts" --include="*.tsx" customer-portal-full 2>/dev/null; then FOUND=1; fi
          if grep -rn "sk_live_" --include="*.js" --include="*.cjs" --include="*.ts" customer-portal-full 2>/dev/null; then FOUND=1; fi
          if grep -rn "BEGIN.*PRIVATE KEY" --include="*.js" --include="*.cjs" --include="*.ts" customer-portal-full 2>/dev/null; then FOUND=1; fi
          if [ $FOUND -eq 0 ]; then
            echo "No hardcoded secrets detected"
          else
            echo "Potential secrets found - review above"
          fi

  # ── Dependency Audit ──
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit
        working-directory: customer-portal-full
        run: npm audit --audit-level=critical || true
