name: InsurePortal CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Go Vet (all services)
        run: |
          for svc in $(find . -name 'go.mod' -not -path './node_modules/*' -exec dirname {} \;); do
            echo "=== Vetting $svc ==="
            (cd "$svc" && go vet ./...) || exit 1
          done

  test-go:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ngapp
          POSTGRES_PASSWORD: ngapp
          POSTGRES_DB: ngapp
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run Go Tests
        env:
          DATABASE_URL: postgres://ngapp:ngapp@localhost:5432/ngapp?sslmode=disable
        run: |
          for svc in $(find . -name '*_test.go' -not -path './node_modules/*' -exec dirname {} \; | sort -u); do
            echo "=== Testing $svc ==="
            (cd "$svc" && go test -v -count=1 -timeout 60s ./...) || exit 1
          done

  test-ts:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go Security Scan
        uses: securego/gosec@master
        with:
          args: '-no-fail ./...'
      - name: Dependency Audit
        run: npm audit --audit-level=high || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-go, test-ts]
    strategy:
      matrix:
        service: [claims-adjudication-engine, agent-network-platform, ai-claims-auto-adjudication, parametric-insurance-engine, insurance-as-a-service, fraud-network-graph]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t insureportal/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}/
