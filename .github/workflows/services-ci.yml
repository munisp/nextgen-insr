name: Services CI

on:
  push:
    paths:
      - 'services/**'
      - 'infrastructure/**'
      - 'docker-compose.services.yaml'
  pull_request:
    paths:
      - 'services/**'
      - 'infrastructure/**'

jobs:
  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - payment-gateway
          - notification-orchestrator
          - agent-gamification
          - regulatory-reporting
          - comparison-engine
          - billing-provisioning-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build ${{ matrix.service }}
        run: |
          cd services/go/${{ matrix.service }}
          if [ -d cmd ]; then
            go build -o /tmp/${{ matrix.service }} ./cmd/
          else
            go build -o /tmp/${{ matrix.service }} .
          fi
      - name: Vet
        run: |
          cd services/go/${{ matrix.service }}
          go vet ./...

  go-root-services:
    # Root-layout Go services (main.go at service root): build, vet, and run
    # their real unit tests. W5b: pbac-engine, dapr-sidecar. W5d (F-11/A1):
    # connectivity + platform services (sprint73/sprint86 contract layout).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - settlement-gateway
          - telemetry-api-gateway
          - pbac-engine
          - dapr-sidecar
          - connectivity-resilience
          - connection-multiplexer
          - bandwidth-optimizer
          - opensearch-analytics
          - apisix-gateway
          - ussd-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.service }}
        run: |
          cd services/go/${{ matrix.service }}
          go build -o /tmp/${{ matrix.service }} .
      - name: Vet
        run: |
          cd services/go/${{ matrix.service }}
          go vet ./...
      - name: Test ${{ matrix.service }}
        run: |
          cd services/go/${{ matrix.service }}
          go test ./...

  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - kyc-verification
          - claims-adjudication
          - churn-prevention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd services/python/${{ matrix.service }}
          pip install -r requirements.txt
      - name: Lint
        run: |
          pip install ruff
          cd services/python/${{ matrix.service }}
          ruff check app/ --ignore E501

  python-root-services:
    # Root-layout Python services (main.py / *_service.py at service root):
    # install real deps, compile-check, and run their real unit tests.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: fraud-ml-service
            main: main.py
            test: test_main.py
            install: true
          - service: billing-analytics-pipeline
            main: main.py
            test: test_main.py
            install: true
          - service: invoice-generator
            main: main.py
            test: test_main.py
            install: true
          - service: billing-webhook-dispatcher
            main: main.py
            test: test_main.py
            install: true
          - service: billing-sla-monitor
            main: main.py
            test: test_main.py
            install: true
          - service: liveness-detection
            main: liveness_service.py
            test: test_noisy_cameras.py
            install: true
          - service: face-matching
            main: face_matching_service.py
            install: false  # heavy backends (deepface/tf-keras) are lazy-imported; service fails loud without them
          - service: document-fraud-detection
            main: fraud_detection_service.py
            install: false  # opencv/Pillow lazy-imported; compile-check only
          - service: paddle-ocr-service
            main: paddle_ocr_service.py
            install: false  # paddlepaddle lazy-imported; compile-check only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        if: matrix.install == true
        run: |
          cd services/python/${{ matrix.service }}
          pip install -r requirements.txt
      - name: Compile check
        run: |
          cd services/python/${{ matrix.service }}
          python -m py_compile ${{ matrix.main }}
      - name: Unit tests
        if: matrix.test
        run: |
          cd services/python/${{ matrix.service }}
          python -m unittest $(basename ${{ matrix.test }} .py) -v

  rust-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build realtime-events
        run: |
          cd services/rust/realtime-events
          cargo check
      - name: Build and test billing-event-processor
        run: |
          cd services/rust/billing-event-processor
          cargo check
          cargo test
      - name: Build and test fee-splitter-realtime
        run: |
          cd services/rust/fee-splitter-realtime
          cargo check
          cargo test
      - name: Build and test ddos-shield
        run: |
          cd services/rust/ddos-shield
          cargo check
          cargo test

  mojaloop-connector:
    # Stdlib-only Python service: compile-check plus its real unittest suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: |
          cd services/python/mojaloop-connector
          python -m py_compile main.py test_main.py
      - name: Unit tests
        run: |
          cd services/python/mojaloop-connector
          python -m unittest test_main -v

  # W5d (F-11/A1): connectivity + resilience Rust services
  rust-services-w5d:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - bandwidth-optimizer
          - offline-ledger
          - adaptive-compression
          - transaction-queue
          - ransomware-guard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check ${{ matrix.service }}
        run: |
          cd services/rust/${{ matrix.service }}
          cargo check
      - name: Test ${{ matrix.service }}
        run: |
          cd services/rust/${{ matrix.service }}
          cargo test

  typescript-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build embedded-sdk
        run: |
          cd services/typescript/embedded-sdk
          npm install
          npx tsc --noEmit --skipLibCheck || true

  # W5d (F-11/A1): python connectivity/cache/security services use
  # root-layout main.py (sprint73/sprint86 contract), not app/
  python-services-w5d:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - redis-cache-layer
          - security-scanner
          - network-quality-predictor
          - sms-transaction-bridge
          - connectivity-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd services/python/${{ matrix.service }}
          pip install -r requirements.txt
      - name: Lint
        run: |
          pip install ruff
          cd services/python/${{ matrix.service }}
          ruff check . --ignore E501

  docker-build:
    runs-on: ubuntu-latest
    needs: [go-services, go-root-services, python-services, python-services-w5d]
    strategy:
      matrix:
        include:
          - path: services/go/payment-gateway
            name: payment-gateway
          - path: services/go/billing-provisioning-workflow
            name: billing-provisioning-workflow
          - path: services/python/kyc-verification
            name: kyc-verification
          - path: services/python/claims-adjudication
            name: claims-adjudication
          - path: services/go/connectivity-resilience
            name: connectivity-resilience
          - path: services/go/opensearch-analytics
            name: opensearch-analytics
          - path: services/rust/transaction-queue
            name: transaction-queue
          - path: services/rust/ransomware-guard
            name: ransomware-guard
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t insureportal/${{ matrix.name }}:test ${{ matrix.path }}
