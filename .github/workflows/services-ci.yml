name: Services CI

on:
  push:
    paths:
      - 'services/**'
      - 'infrastructure/**'
      - 'docker-compose.services.yaml'
  pull_request:
    paths:
      - 'services/**'
      - 'infrastructure/**'

jobs:
  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - payment-gateway
          - notification-orchestrator
          - agent-gamification
          - regulatory-reporting
          - comparison-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build ${{ matrix.service }}
        run: |
          cd services/go/${{ matrix.service }}
          go build -o /tmp/${{ matrix.service }} ./cmd/
      - name: Vet
        run: |
          cd services/go/${{ matrix.service }}
          go vet ./...

  go-root-services:
    # Root-layout Go services (main.go at service root, stdlib-only): build,
    # vet, and run their real unit tests.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - pbac-engine
          - dapr-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.service }}
        run: |
          cd services/go/${{ matrix.service }}
          go build -o /tmp/${{ matrix.service }} .
      - name: Vet
        run: |
          cd services/go/${{ matrix.service }}
          go vet ./...
      - name: Test ${{ matrix.service }}
        run: |
          cd services/go/${{ matrix.service }}
          go test ./...

  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - kyc-verification
          - claims-adjudication
          - churn-prevention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd services/python/${{ matrix.service }}
          pip install -r requirements.txt
      - name: Lint
        run: |
          pip install ruff
          cd services/python/${{ matrix.service }}
          ruff check app/ --ignore E501

  rust-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build realtime-events
        run: |
          cd services/rust/realtime-events
          cargo check
      - name: Build and test ddos-shield
        run: |
          cd services/rust/ddos-shield
          cargo check
          cargo test

  mojaloop-connector:
    # Stdlib-only Python service: compile-check plus its real unittest suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check
        run: |
          cd services/python/mojaloop-connector
          python -m py_compile main.py test_main.py
      - name: Unit tests
        run: |
          cd services/python/mojaloop-connector
          python -m unittest test_main -v

  typescript-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build embedded-sdk
        run: |
          cd services/typescript/embedded-sdk
          npm install
          npx tsc --noEmit --skipLibCheck || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [go-services, python-services]
    strategy:
      matrix:
        include:
          - path: services/go/payment-gateway
            name: payment-gateway
          - path: services/python/kyc-verification
            name: kyc-verification
          - path: services/python/claims-adjudication
            name: claims-adjudication
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t insureportal/${{ matrix.name }}:test ${{ matrix.path }}
