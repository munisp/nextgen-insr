name: ESLint Bulk Fix (one-off maintenance)

# Temporary maintenance workflow (assurance engagement, 2026-08-16):
# runs eslint --fix over server/ on a full-size runner (local sandboxes OOM),
# uploads the post-fix JSON report for the ratchet baseline, and commits the
# auto-fixes back to main. To be removed once lint debt ratchet is in place.

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  fix:
    name: eslint --fix server/ + report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eslint --fix
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm exec eslint server/ --ext .ts,.tsx,.js,.jsx --fix -f unix > fix-output.txt 2>&1 || true
          wc -l fix-output.txt

      - name: Post-fix report (JSON)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm exec eslint server/ --ext .ts,.tsx,.js,.jsx -f json > eslint-report.json 2>&1 || true
          node -e "const r=require('./eslint-report.json');let e=0,w=0;for(const f of r){e+=f.errorCount;w+=f.warningCount}console.log('errors',e,'warnings',w)"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: eslint-fix-reports
          path: |
            fix-output.txt
            eslint-report.json
          retention-days: 14

      - name: Commit auto-fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes from --fix"
          else
            git commit -m "style(lint): eslint --fix auto-fixes over server/ (import/order, prefer-const, consistent-type-imports et al.)"
            git push
          fi
