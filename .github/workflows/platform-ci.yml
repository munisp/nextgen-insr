name: InsurePortal Platform CI

on:
  push:
    branches: [main, develop, 'devin/*']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ── Server Build & Test ──
  server:
    name: Server Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ngapp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ngapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: customer-portal-full
        run: npm install --legacy-peer-deps
      - name: Initialize database
        env:
          PGPASSWORD: test_password
        run: psql -h localhost -U ngapp -d ngapp -f customer-portal-full/ci-init.sql
      - name: Start server
        working-directory: customer-portal-full
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: ngapp
          PGPASSWORD: test_password
          PGDATABASE: ngapp
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          PORT: 5002
        run: |
          node server.cjs &
          sleep 5
      - name: Smoke tests
        working-directory: customer-portal-full
        run: bash smoke-test.sh
      - name: Integration tests
        working-directory: customer-portal-full
        run: node tests/integration.test.js

  # ── Security Scan ──
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'customer-portal-full'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
