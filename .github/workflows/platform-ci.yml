name: NGApp Platform CI/CD

on:
  push:
    branches: [main, develop, 'devin/*']
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── Go Services: build + test ────────────────────────────────────────
  go-services:
    name: Go Services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - claims-adjudication-engine
          - fraud-detection-go
          - ussd-gateway
          - enhanced-kyc-kyb
          - enterprise-mdm
          - disaster-recovery-module
          - naicom-compliance-module
          - ab-testing-framework
          - agent-commission-management
          - agent-mobile-app
          - audit-trail-system
          - bancassurance-integration
          - batch-processing-engine
          - customer-360-view
          - gdpr-compliance
          - group-life-admin
          - native-mobile-ios
          - ndpr-compliance
          - nmid-integration
          - performance-monitoring-dashboard
          - pfa-integration
          - policy-renewal-automation
          - reinsurance-management
          - strategic-implementations
          - insurance-tech-innovations
          - blockchain-transparency
          - microinsurance-engine
          - takaful-module
          - multi-country-regulatory
          - usage-based-insurance
          - premium-finance-service
          - instant-payout-service
          - cross-company-fraud-database
          - dr-ha-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ngapp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ngapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        working-directory: ${{ matrix.service }}
        run: go mod download

      - name: go vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: go build
        working-directory: ${{ matrix.service }}
        run: go build -v ./...

      - name: go test
        working-directory: ${{ matrix.service }}
        env:
          DATABASE_URL: postgres://ngapp:test_password@localhost:5432/ngapp_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: go test -race -coverprofile=coverage.out -covermode=atomic -timeout=5m ./...

  # ── Python Services: test + lint ─────────────────────────────────────
  python-services:
    name: Python / ML Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - ifrs17-engine
          - mlops-governance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: ruff lint
        working-directory: ${{ matrix.service }}
        run: ruff check . --select E,W,F --ignore E501

      - name: py_compile syntax check
        working-directory: ${{ matrix.service }}
        run: find . -name "*.py" -not -path "*/node_modules/*" -exec python -m py_compile {} \;

      - name: Run pytest
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v
          else
            python -m pytest . -v --co 2>/dev/null || echo "No tests discovered, but code compiled"
          fi

  # ── TypeScript: type-check + build ────────────────────────────────────
  typescript:
    name: TypeScript (Type Check + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check (tsc --noEmit)
        run: pnpm run check
        env:
          NODE_ENV: test

      - name: Verify no @ts-nocheck in production files
        run: |
          echo "Checking for @ts-nocheck directives in production server code..."
          COUNT=$(grep -r "// @ts-nocheck" server/ --include="*.ts" --exclude="*.test.*" | wc -l)
          echo "Found $COUNT @ts-nocheck in production files"
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::@ts-nocheck found in $COUNT production files. These should be fixed."
            grep -rn "// @ts-nocheck" server/ --include="*.ts" --exclude="*.test.*"
          fi

      - name: Vite build
        run: pnpm run build
        env:
          NODE_ENV: production

  # ── Frontend: npm test ────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm test (vitest)
        run: pnpm test

  # ── Shared Go Packages: build ─────────────────────────────────────────
  shared-packages:
    name: Shared Go Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        working-directory: shared
        run: go mod download

      - name: go build shared packages
        working-directory: shared
        run: go build ./...

  # ── Security Scan ────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential hardcoded secrets..."
          grep -rn "AKIA\|sk_live_\|sk_test_\|-----BEGIN.*PRIVATE KEY" \
            --include="*.ts" --include="*.go" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=.git . || echo "No hardcoded secrets found"
