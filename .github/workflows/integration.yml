name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurance_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema
        run: pnpm exec drizzle-kit push --force
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/insurance_portal_test

      - name: Run integration tests
        run: pnpm test:integration
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/insurance_portal_test
          # Real Redis for the fail-closed distributed locks / token
          # blacklists exercised by the money-path tests (mirrors the
          # contract and e2e jobs).
          REDIS_URL: redis://localhost:6379

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurance_portal_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The e2e globalSetup applies the schema itself (drizzle-kit push
      # --force) against POSTGRES_URL, so no separate push step is needed.

      # HTTP end-to-end: boots the REAL express/tRPC server and drives raw
      # HTTP through the full middleware chain against the postgres:16 and
      # redis:7 services. No PGlite, no mini-Redis, no skips.
      - name: Run HTTP E2E tests
        run: pnpm test:e2e
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/insurance_portal_e2e
          REDIS_URL: redis://localhost:6379

  contract:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurance_portal_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The contract suite reuses the e2e globalSetup, which applies the
      # schema itself (drizzle-kit push --force) against POSTGRES_URL.

      # API contract: boots the REAL express/tRPC server and asserts the
      # public wire contract over raw HTTP — superjson envelope shapes, zod
      # 400 field detail, 401/403 auth shapes, 501 NOT_IMPLEMENTED stubs,
      # pagination limit caps — against the postgres:16 and redis:7 services.
      - name: Run API contract tests
        run: pnpm test:contract
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/insurance_portal_contract
          REDIS_URL: redis://localhost:6379

  client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Client page tests: real page components in happy-dom with the tRPC
      # network client stubbed at the boundary.
      - name: Run client page tests
        run: pnpm test:client
