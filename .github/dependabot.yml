version: 2
updates:
  # 2026-10-03 (W7-B11): npm entry for "/insureportal" removed — the deprecated
  # nested insureportal/ tree is retired; root app "/" entry below is canonical.

  # ── Root Node.js ──────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"

  # ── Go modules ────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/ussd-gateway"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/whatsapp-bot"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/takaful-engine"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/parametric-insurance"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "gomod"
    directory: "/reinsurance-service"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # ── Python (pip) ──────────────────────────────────────────────────────────
  # 2026-10-03 (W7-B11): path moved from /insureportal/services/python-analytics
  # to /services/python/analytics (sole-copy extraction from deprecated tree).
  - package-ecosystem: "pip"
    directory: "/services/python/analytics"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"

  # ── Rust (cargo) ──────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/services/rust/ledger-sidecar"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"

  # ── Docker images ─────────────────────────────────────────────────────────
  # 2026-10-03 (W7-B11): docker entry for "/insureportal" removed — deprecated
  # tree retired; moved service Dockerfiles live under /services/{go,rust,python}.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
