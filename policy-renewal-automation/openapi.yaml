openapi: '3.0.3'
info:
  title: Policy Renewal Automation
  description: Policy Renewal Automation — automated policy renewal with dynamic pricing Business Rules: - Auto-renew: Customer opt-in required, 30-day advance notice
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: policy-renewal-automation
                  database:
                    type: string
                    example: 'true'
  /api/v1/renewals/upcoming:
    get:
      summary: Upcoming renewals
      responses:
        '200':
          description: Successful upcoming renewals
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/renewals/calculate:
    post:
      summary: Calculate renewal premium
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful calculate renewal premium
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/renewals/process:
    post:
      summary: Process renewal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful process renewal
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
