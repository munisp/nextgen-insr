# Default values for the fluvio chart.
# Mirrors docker-compose.yml / k8s/middleware configuration.
replicaCount: 1
image:
  repository: infinyon/fluvio
  tag: 0.11.11
  pullPolicy: IfNotPresent
fullnameOverride: ''
service:
  type: ClusterIP
  ports:
  - name: public
    port: 9003
  - name: internal
    port: 9004
config:
  RUST_LOG: info
  FLUVIO_SC_NAMESPACE: middleware
secrets:
  UNUSED: no-credentials-required
command:
- fluvio-run
- sc
- --local
- /fluvio/metadata
env:
- name: RUST_LOG
  value: info
- name: FLUVIO_SC_NAMESPACE
  value: middleware
volumeMounts: []
volumes: []
persistence:
  enabled: true
  size: 10Gi
  storageClass: cinder-ssd
  accessModes:
  - ReadWriteOnce
  mountPath: /fluvio
podSecurityContext:
  fsGroup: 1000
terminationGracePeriodSeconds: 30
probes:
  liveness:
    tcpSocket:
      port: 9003
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    tcpSocket:
      port: 9003
    initialDelaySeconds: 10
    periodSeconds: 5
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
pdb:
  minAvailable: 1
