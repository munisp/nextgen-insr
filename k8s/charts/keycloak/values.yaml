# Default values for the keycloak chart.
# Mirrors docker-compose.yml / k8s/middleware configuration.
replicaCount: 2
image:
  repository: quay.io/keycloak/keycloak
  tag: 24.0.4
  pullPolicy: IfNotPresent
fullnameOverride: ''
service:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
  - name: management
    port: 9000
config:
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://postgresql:5432/insureportal
  KC_DB_USERNAME: insureportal
  KC_HTTP_ENABLED: 'true'
  KC_HOSTNAME_STRICT: 'false'
  KC_HEALTH_ENABLED: 'true'
  KC_METRICS_ENABLED: 'true'
  KC_PROXY: edge
  KC_HTTP_RELATIVE_PATH: /
secrets:
  KC_DB_PASSWORD: insureportal_dev
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin-change-me
configAsEnv: true
command:
- /opt/keycloak/bin/kc.sh
- start
- --optimized
env: []
volumeMounts: []
volumes: []
podSecurityContext:
  fsGroup: 1000
terminationGracePeriodSeconds: 30
probes:
  liveness:
    httpGet:
      path: /health/live
      port: 9000
    initialDelaySeconds: 90
    periodSeconds: 10
  readiness:
    httpGet:
      path: /health/ready
      port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10
resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: '1'
pdb:
  minAvailable: 1
