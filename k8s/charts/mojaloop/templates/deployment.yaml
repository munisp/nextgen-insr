apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mojaloop.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mojaloop.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "mojaloop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mojaloop.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mojaloop.fullname" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort | default .port }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          env:
            {{- tpl (toYaml .Values.env) . | nindent 12 }}
          {{- if .Values.configAsEnv }}
          envFrom:
            - configMapRef:
                name: {{ include "mojaloop.fullname" . }}
            - secretRef:
                name: {{ include "mojaloop.fullname" . }}
          {{- end }}
          {{- if .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- range .Values.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
            {{- end }}
      volumes:
        {{- range .Values.volumes }}
        - name: {{ .name }}
          {{- if .configMap }}
          configMap:
            name: {{ include "mojaloop.fullname" $ }}
            {{- if .items }}
            items:
              {{- toYaml .items | nindent 14 }}
            {{- end }}
          {{- else if .secret }}
          secret:
            secretName: {{ include "mojaloop.fullname" $ }}
          {{- else if .emptyDir }}
          emptyDir: {}
          {{- end }}
        {{- end }}
