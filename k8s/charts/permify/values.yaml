# Default values for the permify chart.
# Mirrors docker-compose.yml / k8s/middleware configuration.
replicaCount: 2
image:
  repository: ghcr.io/permify/permify
  tag: v1.3.5
  pullPolicy: IfNotPresent
fullnameOverride: ''
service:
  type: ClusterIP
  ports:
  - name: http
    port: 3476
  - name: grpc
    port: 3478
config:
  PERMIFY_DATABASE_ENGINE: postgres
  PERMIFY_DATABASE_URI: postgres://insureportal:insureportal_dev@postgresql:5432/insureportal?sslmode=disable
  PERMIFY_DATABASE_MAX_OPEN_CONNECTIONS: '20'
  PERMIFY_HTTP_PORT: '3476'
  PERMIFY_GRPC_PORT: '3478'
  PERMIFY_LOGGER_LEVEL: info
secrets:
  PERMIFY_DATABASE_PASSWORD: insureportal_dev
configAsEnv: true
command:
- ./permify
- serve
env: []
volumeMounts: []
volumes: []
podSecurityContext:
  fsGroup: 1000
terminationGracePeriodSeconds: 30
probes:
  liveness:
    httpGet:
      path: /healthz
      port: 3476
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    httpGet:
      path: /healthz
      port: 3476
    initialDelaySeconds: 10
    periodSeconds: 5
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 500m
pdb:
  minAvailable: 1
