# Default values for the opensearch chart.
# Mirrors docker-compose.yml / k8s/middleware configuration.
replicaCount: 1
image:
  repository: opensearchproject/opensearch
  tag: 2.17.0
  pullPolicy: IfNotPresent
fullnameOverride: ''
service:
  type: ClusterIP
  ports:
  - name: http
    port: 9200
  - name: transport
    port: 9600
config:
  cluster.name: insureportal-search
  discovery.type: single-node
  OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
  DISABLE_SECURITY_PLUGIN: 'true'
  DISABLE_INSTALL_DEMO_CONFIG: 'true'
  plugins.security.disabled: 'true'
  network.host: 0.0.0.0
secrets:
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: unused-security-plugin-disabled
configAsEnv: true
env: []
volumeMounts: []
volumes: []
persistence:
  enabled: true
  size: 50Gi
  storageClass: cinder-ssd
  accessModes:
  - ReadWriteOnce
  mountPath: /usr/share/opensearch/data
podSecurityContext:
  fsGroup: 1000
terminationGracePeriodSeconds: 30
probes:
  liveness:
    httpGet:
      path: /_cluster/health
      port: 9200
    initialDelaySeconds: 90
    periodSeconds: 10
  readiness:
    httpGet:
      path: /_cluster/health
      port: 9200
    initialDelaySeconds: 30
    periodSeconds: 10
resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: '1'
pdb:
  minAvailable: 1
