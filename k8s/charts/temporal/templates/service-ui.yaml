apiVersion: v1
kind: Service
metadata:
  name: {{ include "temporal.fullname" . }}-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    {{- include "temporal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
