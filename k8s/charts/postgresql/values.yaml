# Default values for the postgresql chart.
# Mirrors docker-compose.yml / k8s/middleware configuration.
replicaCount: 3
image:
  repository: bitnami/postgresql-repmgr
  tag: 16.4.0
  pullPolicy: IfNotPresent
fullnameOverride: ''
service:
  type: ClusterIP
  ports:
  - name: postgresql
    port: 5432
config:
  POSTGRESQL_DATABASE: insureportal
  POSTGRESQL_USERNAME: insureportal
  REPMGR_USERNAME: repmgr
  REPMGR_PRIMARY_HOST: postgresql-0.postgresql-headless
  REPMGR_PARTNER_NODES: postgresql-0.postgresql-headless,postgresql-1.postgresql-headless,postgresql-2.postgresql-headless
  PGUSER: insureportal
secrets:
  POSTGRESQL_PASSWORD: insureportal_dev
  POSTGRESQL_POSTGRES_PASSWORD: change-me-in-production
  REPMGR_PASSWORD: change-me-repmgr
configAsEnv: true
env:
- name: MY_POD_NAME
  valueFrom:
    fieldRef:
      fieldPath: metadata.name
- name: REPMGR_NODE_NAME
  value: $(MY_POD_NAME)
- name: REPMGR_NODE_NETWORK_NAME
  value: $(MY_POD_NAME).postgresql-headless
volumeMounts: []
volumes: []
persistence:
  enabled: true
  size: 100Gi
  storageClass: cinder-ssd
  accessModes:
  - ReadWriteOnce
  mountPath: /bitnami/postgresql
podSecurityContext:
  fsGroup: 1000
terminationGracePeriodSeconds: 30
probes:
  liveness:
    exec:
      command:
      - /bin/sh
      - -c
      - exec pg_isready -U "$POSTGRESQL_USERNAME" -d "$POSTGRESQL_DATABASE" -h 127.0.0.1 -p 5432
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    exec:
      command:
      - /bin/sh
      - -c
      - -e exec pg_isready -U "$POSTGRESQL_USERNAME" -d "$POSTGRESQL_DATABASE" -h 127.0.0.1 -p 5432
    initialDelaySeconds: 5
    periodSeconds: 5
resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 4Gi
    cpu: '2'
pdb:
  minAvailable: 2
