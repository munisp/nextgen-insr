# Default values for the apisix chart.
# Mirrors docker-compose.yml / k8s/middleware configuration.
replicaCount: 2
image:
  repository: apache/apisix
  tag: 3.9.0-debian
  pullPolicy: IfNotPresent
fullnameOverride: ''

# ── Admin API key ────────────────────────────────────────────────────────────
# The APISIX admin key is NEVER stored in git. The chart reads it at container
# start from an operator-created Kubernetes Secret (valueFrom secretKeyRef)
# and substitutes the __APISIX_ADMIN_KEY__ placeholder in config.yaml before
# APISIX boots. Create the secret once per namespace:
#
#   kubectl create secret generic apisix-admin-key \
#     --from-literal=admin-key="$(openssl rand -hex 24)" \
#     -n <namespace>
adminKeySecret:
  name: apisix-admin-key
  key: admin-key

service:
  type: ClusterIP
  ports:
  - name: http
    port: 9080
  - name: admin
    port: 9180
  - name: https
    port: 9443
config:
  # __APISIX_ADMIN_KEY__ is replaced with $APISIX_ADMIN_KEY (from the secret
  # above) by the container entrypoint wrapper — no key material in this file.
  config.yaml: |
    apisix:
      node_listen: 9080
      enable_admin: true
      allow_admin:
        - 0.0.0.0/0
      admin_key:
        - name: admin
          key: __APISIX_ADMIN_KEY__
          role: admin
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      etcd:
        host:
          - http://apisix-etcd:2379
        prefix: /apisix
        timeout: 30
    nginx_config:
      error_log_level: warn
      worker_processes: auto
    plugins:
      - prometheus
      - jwt-auth
      - key-auth
      - limit-req
      - limit-count
      - cors
      - ip-restriction
      - request-validation
secrets:
  # APISIX itself needs no chart-managed credentials; the admin key comes from
  # the operator-created secret referenced by adminKeySecret above.
  UNUSED: no-credentials-required
env:
- name: APISIX_ADMIN_KEY
  valueFrom:
    secretKeyRef:
      name: '{{ .Values.adminKeySecret.name }}'
      key: '{{ .Values.adminKeySecret.key }}'
command:
- /bin/sh
- -c
args:
- |
  set -e
  sed "s/__APISIX_ADMIN_KEY__/${APISIX_ADMIN_KEY}/g" \
    /etc/apisix-template/config.yaml > /usr/local/apisix/conf/config.yaml
  exec /docker-entrypoint.sh docker-start
volumeMounts:
- name: config
  mountPath: /etc/apisix-template
volumes:
- name: config
  configMap: true
  items:
  - key: config.yaml
    path: config.yaml
podSecurityContext:
  fsGroup: 1000
terminationGracePeriodSeconds: 30
probes:
  liveness:
    httpGet:
      path: /apisix/status
      port: 9080
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    httpGet:
      path: /apisix/status
      port: 9080
    initialDelaySeconds: 10
    periodSeconds: 5
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: '1'
pdb:
  minAvailable: 1
