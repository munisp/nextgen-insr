# KEDA ScaledObjects for Kafka consumer lag-based autoscaling
# Scales pods based on Kafka consumer group lag for critical insurance services
# Apply: kubectl apply -f k8s/scaling/keda-kafka-scalers.yaml
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: claims-adjudication-kafka-scaler
  namespace: insurance
spec:
  scaleTargetRef:
    name: claims-adjudication-engine
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka-1:9092,kafka-2:9092,kafka-3:9092
      consumerGroup: claims-adjudication-cg
      topic: insurance.claims.submitted
      lagThreshold: "50"
      offsetResetPolicy: latest
