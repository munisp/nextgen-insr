##############################################################################
# InsurePortal — Kubernetes Security Context Patch
#
# Applied to ALL deployments via Kustomize strategic merge patch.
# Enforces:
#   - Non-root execution (runAsNonRoot: true)
#   - Read-only root filesystem where possible
#   - No privilege escalation
#   - Drop all Linux capabilities
#   - Seccomp profile: RuntimeDefault
#
# PCI-DSS REQ 2: Secure configurations
# SOC 2 CC6.1: Logical access controls
##############################################################################

# ── Pod-level Security Context ────────────────────────────────────────────────
# Applied to all pods via PodSecurityAdmission or OPA Gatekeeper
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-context-defaults
  namespace: insureportal
data:
  pod-security-context: |
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  container-security-context: |
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL

---
# ── PodSecurityPolicy (Kubernetes < 1.25) / PodSecurity (>= 1.25) ────────────
# Enforces restricted pod security standard across the namespace
apiVersion: v1
kind: Namespace
metadata:
  name: insureportal
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# ── OPA Gatekeeper Constraint: Require SecurityContext ───────────────────────
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredSecurityContext
metadata:
  name: insureportal-require-security-context
spec:
  match:
    kinds:
    - apiGroups: ["apps"]
      kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    namespaces: ["insureportal"]
  parameters:
    requireRunAsNonRoot: true
    requireDropAllCapabilities: true
    requireNoPrivilegeEscalation: true

---
# ── Main App Deployment Security Context ─────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insureportal-app
  namespace: insureportal
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: insureportal-app
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

