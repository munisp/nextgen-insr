# ─────────────────────────────────────────────────────────────────────────────
# k8s/sprint80-billing-services.yaml — Sprint 80 billing engine microservices
#
# Ten Go billing services consumed by the Node platform via
# server/adapters/goServiceAdapter.ts (e.g. billing-aggregator :8086/health).
# Images follow the repo convention registry.insurance.example.com/<svc>:latest
# (see k8s/services/core-platform-services.yaml). Middleware endpoints reuse the
# cluster addresses from k8s/base/configmap.yaml.
#
# Layout:
#   Namespace billing · ServiceAccount billing-svc · middleware ConfigMap ·
#   10 Deployments (+Services, Dapr sidecars, liveness/readiness probes) ·
#   3 HPAs (high-throughput services) · NetworkPolicy · PodDisruptionBudget
#
# Apply:
#   kubectl apply -f k8s/sprint80-billing-services.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: billing
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/part-of: unified-insurance-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing-svc
  namespace: billing
  labels:
    app.kubernetes.io/part-of: unified-insurance-platform
---
# Shared middleware wiring for all billing services. Values mirror
# k8s/base/configmap.yaml cluster addresses.
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-middleware-config
  namespace: billing
data:
  POSTGRES_HOST: "postgresql-ha-pgpool.insurance-platform.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "insurance"
  KAFKA_BROKERS: "insurance-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  TEMPORAL_ADDRESS: "temporal-frontend.middleware.svc.cluster.local:7233"
  TIGERBEETLE_ADDRESSES: "tigerbeetle.middleware.svc.cluster.local:3000"
  OPENSEARCH_URL: "https://opensearch-cluster-master.middleware.svc.cluster.local:9200"
  PERMIFY_URL: "http://permify.insurance-platform.svc.cluster.local:3476"
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"
  FLUVIO_ENDPOINT: "fluvio-sc.middleware.svc.cluster.local:9003"
  LAKEHOUSE_S3_ENDPOINT: "http://iceberg-rest.middleware.svc.cluster.local:8181"
  MOJALOOP_HUB_URL: "https://mojaloop-hub.middleware.svc.cluster.local"
  APISIX_ADMIN_URL: "http://apisix-admin.middleware.svc.cluster.local:9180"
  KEYCLOAK_URL: "http://keycloak.insurance-platform.svc.cluster.local:8080"
  OPENAPPSEC_AGENT_URL: "http://openappsec-agent.middleware.svc.cluster.local:8085"
  GO_ENV: "production"
  LOG_LEVEL: "info"
---
# Aggregates tenant billing periods and revenue-share splits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-aggregator
  namespace: billing
  labels:
    app: billing-aggregator
    app.kubernetes.io/part-of: unified-insurance-platform
    app.kubernetes.io/component: billing
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: billing-aggregator
  template:
    metadata:
      labels:
        app: billing-aggregator
        app.kubernetes.io/part-of: unified-insurance-platform
        app.kubernetes.io/component: billing
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "billing-aggregator"
        dapr.io/app-port: "8086"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
    spec:
      serviceAccountName: billing-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: billing-aggregator
          image: registry.insurance.example.com/billing-aggregator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: billing-middleware-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: insureportal-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insureportal-secrets
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: registry-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: billing-aggregator
  namespace: billing
  labels:
    app: billing-aggregator
    app.kubernetes.io/part-of: unified-insurance-platform
    app.kubernetes.io/component: billing
spec:
  type: ClusterIP
  selector:
    app: billing-aggregator
  ports:
    - name: http
      port: 80
      targetPort: http
