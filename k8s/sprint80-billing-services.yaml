kind: Deployment
metadata:
  name: carrier-billing
  namespace: billing
  labels:
    app: carrier-billing
    app.kubernetes.io/part-of: unified-insurance-platform
    app.kubernetes.io/component: billing
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: carrier-billing
  template:
    metadata:
      labels:
        app: carrier-billing
        app.kubernetes.io/part-of: unified-insurance-platform
        app.kubernetes.io/component: billing
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "carrier-billing"
        dapr.io/app-port: "8317"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8317"
    spec:
      serviceAccountName: billing-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: carrier-billing
          image: registry.insurance.example.com/carrier-billing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8317
          envFrom:
            - configMapRef:
                name: billing-middleware-config
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: insureportal-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insureportal-secrets
                  key: database-url
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      imagePullSecrets:
        - name: registry-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: carrier-billing
  namespace: billing
  labels:
    app: carrier-billing
    app.kubernetes.io/part-of: unified-insurance-platform
    app.kubernetes.io/component: billing
spec:
  type: ClusterIP
  selector:
    app: carrier-billing
  ports:
    - name: http
      port: 80
      targetPort: http
---
