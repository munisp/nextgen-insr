---
# High-throughput services autoscale on CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-stream-processor-hpa
  namespace: billing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-stream-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-aggregator-hpa
  namespace: billing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-aggregator
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fee-split-calculator-hpa
  namespace: billing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fee-split-calculator
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Default-deny ingress inside the billing namespace; only the platform
# namespace (Node monolith / API gateway) may reach billing services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billing-ingress-policy
  namespace: billing
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: insurance-platform
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
    # Middleware namespaces (postgres/redis/kafka/tigerbeetle/temporal/...)
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: middleware
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: insurance-platform
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: billing-services-pdb
  namespace: billing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: billing
