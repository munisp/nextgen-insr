apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-default-deny
  namespace: insureportal
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-app-ingress
  namespace: insureportal
spec:
  podSelector:
    matchLabels:
      app: insureportal-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: apisix
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - podSelector:
        matchLabels:
          app: permify
    ports:
    - protocol: TCP
      port: 3476
  - to:
    - podSelector:
        matchLabels:
          app: temporal
    ports:
    - protocol: TCP
      port: 7233
  - to:
    - podSelector:
        matchLabels:
          app: tb-sidecar
    ports:
    - protocol: TCP
      port: 7070
  - to:
    - podSelector:
        matchLabels:
          app: fraud-gate
    ports:
    - protocol: TCP
      port: 8090
  - to:
    - podSelector:
        matchLabels:
          app: ollama
    ports:
    - protocol: TCP
      port: 11434
  - to:  # DNS
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-db-isolation
  namespace: insureportal
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: insureportal-app
  - from:
    - podSelector:
        matchLabels:
          app: temporal
  - from:
    - podSelector:
        matchLabels:
          app: kyc-verification
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-redis-isolation
  namespace: insureportal
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: insureportal-app
  - from:
    - podSelector:
        matchLabels:
          app: fraud-gate
