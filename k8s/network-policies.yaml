##############################################################################
# InsurePortal — Kubernetes Network Policies (Zero-Trust Isolation)
#
# Architecture:
#   - Default DENY ALL ingress and egress for all pods
#   - Explicit allow rules per service (least-privilege)
#   - Each service only communicates with its required dependencies
#   - All external traffic must enter through APISIX gateway
#
# PCI-DSS REQ 1: Network security controls
# SOC 2 CC6.6: Logical access controls
##############################################################################

# ── 1. Default Deny All ──────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-default-deny-all
  namespace: insureportal
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# ── 2. DNS Egress (required for all pods) ────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-allow-dns
  namespace: insureportal
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# ── 3. Main Application (insureportal-app) ───────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-app-policy
  namespace: insureportal
spec:
  podSelector:
    matchLabels:
      app: insureportal-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: apisix
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - podSelector:
        matchLabels:
          app: permify
    ports:
    - protocol: TCP
      port: 3476
  - to:
    - podSelector:
        matchLabels:
          app: temporal
    ports:
    - protocol: TCP
      port: 7233
  - to:
    - podSelector:
        matchLabels:
          app: tb-sidecar
    ports:
    - protocol: TCP
      port: 7070
  - to:
    - podSelector:
        matchLabels:
          app: fraud-gate
    ports:
    - protocol: TCP
      port: 8090
  - to:
    - podSelector:
        matchLabels:
          app: ollama
    ports:
    - protocol: TCP
      port: 11434
  - to:
    - podSelector:
        matchLabels:
          app: dapr-sidecar
    ports:
    - protocol: TCP
      port: 3500
  - to:
    - podSelector:
        matchLabels:
          app: fluvio
    ports:
    - protocol: TCP
      port: 9003
  - to:
    - podSelector:
        matchLabels:
          app: ml-fraud-scoring
    ports:
    - protocol: TCP
      port: 8001
  - to:
    - podSelector:
        matchLabels:
          app: kyc-verification
    ports:
    - protocol: TCP
      port: 8002
  - to:
    - podSelector:
        matchLabels:
          app: float-reconciler
    ports:
    - protocol: TCP
      port: 8100
  - to:
    - podSelector:
        matchLabels:
          app: health-worker
    ports:
    - protocol: TCP
      port: 8101
  - to:
    - podSelector:
        matchLabels:
          app: slo-engine
    ports:
    - protocol: TCP
      port: 8200

---
# ── 4. PostgreSQL — Only app, temporal, kyc-verification can connect ─────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: insureportal-postgres-policy
  namespace: insureportal
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: insureportal-app
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: temporal
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: kyc-verification
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: float-reconciler
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: health-worker
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: slo-engine
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: ml-fraud-scoring
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          app: claims-adjudication
    ports:
    - protocol: TCP
      port: 5432
  egress: []  # PostgreSQL does not initiate outbound connections

