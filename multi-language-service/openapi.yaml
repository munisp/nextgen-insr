openapi: '3.0.3'
info:
  title: Multi Language Service
  description: Multi-Language Service — i18n for Nigerian languages + Pan-African markets Supported: English, Yoruba, Igbo, Hausa, Pidgin, French (West Africa) Business Rules:
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: multi-language-service
                  database:
                    type: string
                    example: 'true'
  /api/v1/languages:
    get:
      summary: Func
      responses:
        '200':
          description: Successful func
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/translate/{lang}:
    get:
      summary: Func
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful func
        '400':
          description: Bad request
        '500':
          description: Internal server error
