[project]
name = "ngapp-ai-ml-platform"
version = "1.0.0"
description = "Real AI/ML/DL/GNN platform for NGApp insurance — trained models, not scaffolding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
    "deltalake>=0.14.0",
    "pyarrow>=14.0.0",
    "ray[default]>=2.9.0",
    "numpyro>=0.13.0",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "neo4j>=5.15.0",
    "mlflow>=2.9.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "polars>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.25.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
