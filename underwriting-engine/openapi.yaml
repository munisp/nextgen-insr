openapi: '3.0.3'
info:
  title: Underwriting Engine
  description: Underwriting Engine Automated risk assessment and premium calculation. Integrates with: Postgres, Redis, Kafka, OpenSearch
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: underwriting-engine
                  database:
                    type: string
                    example: 'true'
  /api/v1/quote:
    get:
      summary: quote
      responses:
        '200':
          description: Successful quote
        '400':
          description: Bad request
        '500':
          description: Internal server error
