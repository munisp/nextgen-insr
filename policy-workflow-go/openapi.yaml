openapi: '3.0.3'
info:
  title: Policy Workflow Go
  description: Policy Workflow Engine — state machine for policy lifecycle management States: draft → submitted → underwriting → approved/declined → issued → active → renewal/lapsed/cancelled Business Rules:
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: policy-workflow-go
                  database:
                    type: string
                    example: 'true'
  /api/v1/workflow/transition:
    post:
      summary: Transition policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful transition policy
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/workflow/valid-transitions/{state}:
    get:
      summary: Get valid transitions
      parameters:
        - name: state
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful get valid transitions
        '400':
          description: Bad request
        '500':
          description: Internal server error
