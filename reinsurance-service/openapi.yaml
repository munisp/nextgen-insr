openapi: '3.0.3'
info:
  title: Reinsurance Service
  description: Reinsurance Service Manages treaty and facultative reinsurance relationships. Integrates with: Postgres, Kafka, TigerBeetle (settlements)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: reinsurance-service
                  database:
                    type: string
                    example: 'true'
  /api/v1/treaties:
    get:
      summary: treaties
      responses:
        '200':
          description: Successful treaties
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/v1/cede:
    get:
      summary: cede
      responses:
        '200':
          description: Successful cede
        '400':
          description: Bad request
        '500':
          description: Internal server error
