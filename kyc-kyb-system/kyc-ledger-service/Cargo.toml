[package]
name = "kyc-ledger-service"
version = "1.0.0"
edition = "2021"
description = "KYC-gated financial ledger service with TigerBeetle, Dapr, and OpenAppSec integration"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
