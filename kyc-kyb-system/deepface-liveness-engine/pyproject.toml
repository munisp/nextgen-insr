[project]
name = "deepface-liveness-engine"
version = "1.0.0"
description = "World-class liveness detection and face verification engine using DeepFace"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "deepface>=0.0.93",
    "tf-keras>=2.16.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
