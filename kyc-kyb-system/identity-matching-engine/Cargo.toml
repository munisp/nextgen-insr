[package]
name = "identity-matching-engine"
version = "1.0.0"
edition = "2021"
description = "High-performance identity matching and fraud detection engine"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = "0.25"
ndarray = "0.16"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
