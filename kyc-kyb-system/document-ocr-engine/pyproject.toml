[project]
name = "document-ocr-engine"
version = "1.0.0"
description = "Document OCR and extraction engine using PaddleOCR, VLM, and Docling"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "paddleocr>=2.8.0",
    "paddlepaddle>=2.6.0",
    "docling>=2.0.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
    "pdf2image>=1.17.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
