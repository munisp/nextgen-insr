openapi: '3.0.3'
info:
  title: Nmid Integration
  description: NMIDClient handles integration with Nigerian Motor Insurance Database VehicleInfo represents vehicle information from NMID
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: nmid-integration
                  database:
                    type: string
                    example: 'true'
  /api/nmid/verify:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /api/nmid/register:
    get:
      summary: Service
      responses:
        '200':
          description: Successful service
        '400':
          description: Bad request
        '500':
          description: Internal server error
