openapi: '3.0.3'
info:
  title: Broker Api Service
  description: Broker API Service — manages insurance broker integrations and commission Business Rules: - Broker tiers: Bronze (5% commission), Silver (7%), Gold (10%), Platinum (12%)
  version: 1.0.0
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: broker-api-service
                  database:
                    type: string
                    example: 'true'
  /:
    get:
      summary: List brokers
      responses:
        '200':
          description: Successful list brokers
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /{id}/commission:
    get:
      summary: Calculate commission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful calculate commission
        '400':
          description: Bad request
        '500':
          description: Internal server error
  /{id}/validate-license:
    post:
      summary: Validate license
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successful validate license
        '201':
          description: Resource created
        '400':
          description: Bad request
        '500':
          description: Internal server error
